name: Refresh review cassette metadata

on:
  push:
    branches: [agent/consolidate-pr-review-fixes]

permissions:
  contents: write

concurrency:
  group: refresh-review-cassette-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/consolidate-pr-review-fixes
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Refresh deterministic metadata
        run: |
          set -euo pipefail
          unset OPENROUTER_API_KEY || true
          python scripts/refresh_vcr_metadata.py --all-models --write
          python scripts/check_cassette_policy.py
          ./scripts/verify_all_models.sh

      - name: Commit refreshed metadata
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-review-cassette-metadata.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/llm/vcr/cassettes .github/workflows/refresh-review-cassette-metadata.yml
          git diff --cached --check
          git commit -m "test: refresh cassette metadata after review fixes"
          git push origin HEAD:agent/consolidate-pr-review-fixes
