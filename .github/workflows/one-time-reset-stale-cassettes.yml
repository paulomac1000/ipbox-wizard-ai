name: One-time reset stale cassettes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: one-time-reset-stale-cassettes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reset:
    if: github.head_ref == 'fix/decouple-mix-allocation-from-w'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Remove cassettes invalidated by the authoritative algorithm change
        run: |
          set -euo pipefail
          find tests/llm/vcr/cassettes -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          find tests/llm/vcr/cassettes -maxdepth 1 -type f ! -name '.gitkeep' -delete
          touch tests/llm/vcr/cassettes/.gitkeep
          rm .github/workflows/one-time-reset-stale-cassettes.yml

      - name: Commit reset
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No stale cassettes to remove.'; exit 0; }
          git commit -m 'test: remove cassettes invalidated by final contract sync'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
