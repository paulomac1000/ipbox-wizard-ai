name: Apply verified audit fixes
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/decouple-mix-allocation-from-w
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
          persist-credentials: true
          fetch-depth: 0
      - name: Reconstruct and verify payload
        run: |
          set -euo pipefail
          cat .audit/part-00 .audit/part-01 .audit/part-02 .audit/part-03 \
              .audit/part-04 .audit/part-05a .audit/part-05b .audit/part-05c \
              .audit/part-05d .audit/part-05e .audit/part-06 .audit/part-07 \
              > payload.b64
          base64 --decode payload.b64 > changes.tar.gz
          echo '8ad82f3f653970c1c80f93a7b1c180733f47dc612d118aabc7f6cc77b355818b  changes.tar.gz' | sha256sum --check --strict
      - name: Apply clean source tree
        run: |
          set -euo pipefail
          rm -rf tests/llm/vcr/cassettes
          mkdir -p tests/llm/vcr/cassettes
          touch tests/llm/vcr/cassettes/.gitkeep
          tar -xzf changes.tar.gz
          rm -rf .audit payload.b64 changes.tar.gz .ruff_cache .pytest_cache .coverage
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Validate deterministic gates
        run: |
          set -euo pipefail
          ruff format --check .
          ruff check .
          python -m compileall -q python_helper tests scripts
          pytest tests/unit --cov=python_helper --cov-report=term-missing --cov-fail-under=90
          pytest -q
          python scripts/check_cassette_policy.py
          for script in scripts/*.sh dump-to-md.sh; do bash -n "$script"; done
      - name: Commit verified changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          test -n "$(git status --porcelain)"
          git commit -m 'fix: harden decision protocol and trim benchmark matrix'
          git push origin HEAD:fix/decouple-mix-allocation-from-w
