name: Publish verified thermomodernization audit patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-thermo-patch-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: pip install -q -r requirements.txt -r requirements-test.txt

      - name: Apply generator as repository data
        run: |
          python - <<'PYRUN'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path(".github/workflows/debug-thermo-audit-temp.yml").read_text(
              encoding="utf-8"
          )
          match = re.search(
              r"      - name: Reuse audited patch definition\n"
              r"        run: \|\n"
              r"          python - <<'PYRUN'\n"
              r"(.*?)\n"
              r"          PYRUN\n",
              workflow,
              re.DOTALL,
          )
          if match is None:
              raise SystemExit("Cannot extract debug patch definition")
          script = textwrap.dedent(match.group(1))
          exec(compile(script, "<debug-patch>", "exec"), {})

          stopped_path = Path("tests/unit/test_scenarios_and_evaluator.py")
          stopped_lines = stopped_path.read_text(encoding="utf-8").splitlines()
          stopped_start = next(
              index
              for index, line in enumerate(stopped_lines)
              if line.strip() == "financial_tax_fields = ("
          )
          evidence_line = next(
              index
              for index in range(stopped_start, len(stopped_lines))
              if '== "NOT_APPLICABLE"' in stopped_lines[index]
          )
          stopped_end = evidence_line + 1
          stopped_lines[stopped_start : stopped_end + 1] = [
              "    financial_tax_fields = (",
              '        "podstawa_IP",',
              '        "podstawa_NIE",',
              '        "podstawa_zwykła",',
              '        "dochód_IP_po_uldze_BR",',
              '        "dochód_IP_kwalifikowany",',
              '        "dochód_IP_poza_preferencją",',
              '        "podatek_IP",',
              '        "podatek_NIE_finalny",',
              '        "podatek_całościowy",',
              '        "nadpłata_lub_dopłata",',
              '        "thermomodernization_used",',
              '        "termomodernization_carry_over",',
              '        "termomodernization_expired",',
              '        "health_tax_credit_used",',
              '        "ulga_BR_IP_wykorzystana",',
              '        "ulga_BR_NIE_wykorzystana",',
              '        "ulga_BR_carry_over",',
              '        "dochód_dodatkowy_skala",',
              "    )",
              '    assert all(result["podatek"][field] == 0 for field in financial_tax_fields)',
              '    assert result["podatek"]["thermomodernization_mode"] == "none"',
              "    assert (",
              '        result["podatek"]["thermomodernization_evidence_status"]',
              '        == "NOT_APPLICABLE"',
              "    )",
          ]
          stopped_path.write_text("\n".join(stopped_lines) + "\n", encoding="utf-8")

          workflow_path = Path("tests/unit/test_vcr_and_client.py")
          workflow_lines = workflow_path.read_text(encoding="utf-8").splitlines()
          model_budget_line = next(
              index
              for index, line in enumerate(workflow_lines)
              if "MAX_COST_PER_MODEL_USD" in line
          )
          workflow_start = model_budget_line
          while workflow_start >= 0 and workflow_lines[workflow_start].strip() != "assert (":
              workflow_start -= 1
          workflow_end = next(
              index
              for index in range(model_budget_line, len(workflow_lines))
              if "RUN_PAID_BENCHMARK" in workflow_lines[index]
          )
          expr_open = "$" + "{{"
          expr_close = "}}"
          workflow_lines[workflow_start : workflow_end + 1] = [
              "    assert (",
              (
                  '        "MAX_COST_PER_MODEL_USD: '
                  f"{expr_open} inputs.max-cost-per-model-usd {expr_close}"
                  '" in paid'
              ),
              "    )",
              (
                  '    assert "MAX_TOTAL_COST_USD: '
                  f"{expr_open} inputs.max-total-cost-usd {expr_close}"
                  '" in paid'
              ),
              '    assert "inputs.confirmation == \'RUN_PAID_BENCHMARK\'" in paid',
          ]
          workflow_path.write_text("\n".join(workflow_lines) + "\n", encoding="utf-8")
          PYRUN

      - name: Format, lint, and compile
        run: |
          set -euo pipefail
          ruff format .
          ruff check --fix .
          ruff format --check .
          ruff check .
          python -m compileall -q python_helper tests scripts

      - name: Capture unit-test diagnostics
        run: |
          set +e
          mkdir -p reports
          pytest tests/unit \
            --cov=python_helper \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            > reports/unit-tests.txt 2>&1
          printf '%s\n' "$?" > reports/unit-tests-status.txt
          exit 0

      - name: Upload unit-test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: publish-thermo-unit-${{ github.sha }}
          path: reports/
          if-no-files-found: error
          retention-days: 1

      - name: Enforce unit tests
        run: |
          set -euo pipefail
          cat reports/unit-tests.txt
          test "$(cat reports/unit-tests-status.txt)" -eq 0
          rm -rf reports

      - name: Full free suite
        run: pytest -q

      - name: Shell syntax and diff checks
        run: |
          set -euo pipefail
          for script in scripts/*.sh dump-to-md.sh; do bash -n "$script"; done
          git diff --check

      - name: Publish verified code patch
        run: |
          set -euo pipefail
          git add \
            python_helper/tax_year_rules.py \
            python_helper/tax_cascade.py \
            tests/llm/oracle.py \
            tests/llm/oracle_guards.py \
            tests/llm/output_schema.py \
            tests/llm/scenarios/27_termomodernizacja_full.yaml \
            tests/llm/scenarios/28_edge_multiple_carry-overs.yaml \
            tests/llm/scenarios/48_historical_2024_pit_like_cascade.yaml \
            tests/unit/test_tax_year_rules.py \
            tests/unit/test_final_audit_regressions.py \
            tests/unit/test_scenarios_and_evaluator.py \
            tests/unit/test_vcr_and_client.py \
            docs/historical-tax-rules.md
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: make relief evidence and recording budgets auditable"
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
