name: Publish verified thermomodernization audit patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-thermo-patch-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: pip install -q -r requirements.txt -r requirements-test.txt

      - name: Apply generator as repository data
        run: |
          python - <<'PYRUN'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path(".github/workflows/debug-thermo-audit-temp.yml").read_text(
              encoding="utf-8"
          )
          match = re.search(
              r"      - name: Reuse audited patch definition\n"
              r"        run: \|\n"
              r"          python - <<'PYRUN'\n"
              r"(.*?)\n"
              r"          PYRUN\n",
              workflow,
              re.DOTALL,
          )
          if match is None:
              raise SystemExit("Cannot extract debug patch definition")
          script = textwrap.dedent(match.group(1))
          exec(compile(script, "<debug-patch>", "exec"), {})

          def normalize_generated_range(
              path: str,
              *,
              start_index: int,
              end_index: int,
          ) -> None:
              target = Path(path)
              lines = target.read_text(encoding="utf-8").splitlines()
              raw_block = "\n".join(lines[start_index : end_index + 1])
              normalized = textwrap.indent(textwrap.dedent(raw_block), "    ").splitlines()
              lines[start_index : end_index + 1] = normalized
              target.write_text("\n".join(lines) + "\n", encoding="utf-8")

          stopped_path = "tests/unit/test_scenarios_and_evaluator.py"
          stopped_lines = Path(stopped_path).read_text(encoding="utf-8").splitlines()
          stopped_start = next(
              index
              for index, line in enumerate(stopped_lines)
              if line.strip() == "financial_tax_fields = ("
          )
          evidence_line = next(
              index
              for index in range(stopped_start, len(stopped_lines))
              if '== "NOT_APPLICABLE"' in stopped_lines[index]
          )
          stopped_end = evidence_line + 1
          if stopped_lines[stopped_end].strip() != ")":
              raise SystemExit("Cannot find generated STOP assertion terminator")
          normalize_generated_range(
              stopped_path,
              start_index=stopped_start,
              end_index=stopped_end,
          )

          workflow_path = "tests/unit/test_vcr_and_client.py"
          workflow_lines = Path(workflow_path).read_text(encoding="utf-8").splitlines()
          model_budget_line = next(
              index
              for index, line in enumerate(workflow_lines)
              if "MAX_COST_PER_MODEL_USD" in line
          )
          workflow_start = model_budget_line
          while workflow_start >= 0 and workflow_lines[workflow_start].strip() != "assert (":
              workflow_start -= 1
          if workflow_start < 0:
              raise SystemExit("Cannot find generated workflow assertion start")
          workflow_end = next(
              index
              for index in range(model_budget_line, len(workflow_lines))
              if "RUN_PAID_BENCHMARK" in workflow_lines[index]
          )
          normalize_generated_range(
              workflow_path,
              start_index=workflow_start,
              end_index=workflow_end,
          )
          PYRUN

      - name: Capture generated sources and Ruff diagnostics
        run: |
          set +e
          mkdir -p reports/generated
          cp --parents \
            python_helper/tax_year_rules.py \
            python_helper/tax_cascade.py \
            tests/llm/oracle.py \
            tests/llm/oracle_guards.py \
            tests/llm/output_schema.py \
            tests/unit/test_tax_year_rules.py \
            tests/unit/test_final_audit_regressions.py \
            tests/unit/test_scenarios_and_evaluator.py \
            tests/unit/test_vcr_and_client.py \
            reports/generated/
          ruff format . > reports/ruff-format.txt 2>&1
          printf '%s\n' "$?" > reports/ruff-format-status.txt
          ruff check --fix . > reports/ruff-fix.txt 2>&1
          printf '%s\n' "$?" > reports/ruff-fix-status.txt
          exit 0

      - name: Upload generated patch diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: generated-thermo-patch-${{ github.sha }}
          path: reports/
          if-no-files-found: error
          retention-days: 1

      - name: Enforce Ruff and compile
        run: |
          set -euo pipefail
          cat reports/ruff-format.txt
          cat reports/ruff-fix.txt
          test "$(cat reports/ruff-format-status.txt)" -eq 0
          test "$(cat reports/ruff-fix-status.txt)" -eq 0
          ruff format --check .
          ruff check .
          python -m compileall -q python_helper tests scripts
          rm -rf reports

      - name: Unit tests with coverage
        run: pytest tests/unit --cov=python_helper --cov-report=term-missing --cov-fail-under=90

      - name: Full free suite
        run: pytest -q

      - name: Shell syntax and diff checks
        run: |
          set -euo pipefail
          for script in scripts/*.sh dump-to-md.sh; do bash -n "$script"; done
          git diff --check

      - name: Publish verified code patch
        run: |
          set -euo pipefail
          git add \
            python_helper/tax_year_rules.py \
            python_helper/tax_cascade.py \
            tests/llm/oracle.py \
            tests/llm/oracle_guards.py \
            tests/llm/output_schema.py \
            tests/llm/scenarios/27_termomodernizacja_full.yaml \
            tests/llm/scenarios/28_edge_multiple_carry-overs.yaml \
            tests/llm/scenarios/48_historical_2024_pit_like_cascade.yaml \
            tests/unit/test_tax_year_rules.py \
            tests/unit/test_final_audit_regressions.py \
            tests/unit/test_scenarios_and_evaluator.py \
            tests/unit/test_vcr_and_client.py \
            docs/historical-tax-rules.md
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: make relief evidence and recording budgets auditable"
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
