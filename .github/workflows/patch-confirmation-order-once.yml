name: Patch paid confirmation order once

on:
  push:
    branches:
      - fix/decouple-mix-allocation-from-w

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/record_model.py")
          text = path.read_text(encoding="utf-8")
          old = '''    args = parser.parse_args()\n    _require_paid_confirmation(parser)\n    load_local_env()\n'''
          new = '''    args = parser.parse_args()\n    load_local_env()\n'''
          if old not in text:
              raise SystemExit("initial confirmation block not found")
          text = text.replace(old, new, 1)
          old = '''            failures.append(path.stem)\n            break\n\n        model_paid = paid_cost_since(\n'''
          new = '''            failures.append(path.stem)\n            break\n\n        # Existing cassettes may be validated offline without acknowledgement.\n        # Require a fresh process-level decision immediately before any missing\n        # cassette can lead to a paid provider request.\n        _require_paid_confirmation(parser)\n        model_paid = paid_cost_since(\n'''
          if old not in text:
              raise SystemExit("paid-call insertion point not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          pip install -r requirements-test.txt
          ruff format scripts/record_model.py
          ruff check scripts/record_model.py
          pytest -q tests/unit/test_vcr_and_client.py tests/unit/test_paid_recording_safety.py
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/record_model.py
          git commit -m "fix: require acknowledgement only before a paid call"
          git push origin HEAD:fix/decouple-mix-allocation-from-w
