name: Apply final deterministic audit fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-final-audit-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IPBOX_CALCULATED_AT: "2026-07-25T20:00:00Z"
      IPBOX_CODE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install dependencies
        run: pip install -q -r requirements.txt -r requirements-test.txt
      - name: Apply complete audited overlay
        run: |
          set -euo pipefail
          cat .audit-overlay/part-* | base64 -d | xz -d | tar -xf -
          cp -a payload/. .
          while IFS= read -r path; do
            if [ -n "$path" ]; then
              rm -f "$path"
            fi
          done < delete-paths.txt
          rm -rf payload delete-paths.txt
          python - <<'PY'
          from pathlib import Path

          init_path = Path("python_helper/__init__.py")
          init_text = init_path.read_text(encoding="utf-8")
          init_text = init_text.replace(
              "from .tax_cascade import calculate_tax_for_year\n",
              "from .report_metadata import calculation_meta, source_coverage_complete\n"
              "from .tax_cascade import calculate_tax_for_year\n",
              1,
          )
          init_text = init_text.replace(
              '    "calculate_scale_tax",\n',
              '    "calculate_scale_tax",\n    "calculation_meta",\n',
              1,
          )
          init_text = init_text.replace(
              '    "strict_year",\n',
              '    "source_coverage_complete",\n    "strict_year",\n',
              1,
          )
          init_text = init_text.replace(
              "\nfrom .report_metadata import calculation_meta, source_coverage_complete\n",
              "\n",
              1,
          )
          init_path.write_text(init_text, encoding="utf-8")

          meta_path = Path("python_helper/report_metadata.py")
          meta_text = meta_path.read_text(encoding="utf-8").replace(
              "isinstance(months, (str, bytes))",
              "isinstance(months, str | bytes)",
          )
          meta_path.write_text(meta_text, encoding="utf-8")
          PY
          test -f tests/llm/oracle.py
          test -f tests/llm/oracle_legacy.py
          test ! -e tests/llm/oracle_v2.py
          test -f tests/llm/output_schema.py
          test -f tests/llm/output_schema_legacy.py
          test ! -e tests/llm/output_schema_v2.py
          ! grep -R --line-number --fixed-strings 'sys.modules[' tests/llm
      - name: Format and lint
        run: |
          set -euo pipefail
          ruff format .
          ruff check --fix .
          ruff format --check .
          ruff check .
      - name: Compile Python
        run: python -m compileall -q python_helper tests scripts
      - name: Unit tests with coverage
        run: pytest tests/unit --cov=python_helper --cov-report=term-missing --cov-fail-under=90
      - name: Full free suite
        run: pytest -q
      - name: Shell syntax
        run: |
          set -euo pipefail
          for script in scripts/*.sh dump-to-md.sh; do
            bash -n "$script"
          done
      - name: Cassette policy without committed matrix
        run: python scripts/check_cassette_policy.py
      - name: Final source checks
        run: |
          set -euo pipefail
          git diff --check
          ! grep -R --line-number -E 'oracle_v[0-9]+|output_schema_v[0-9]+|sys\.modules\[' tests README.md AGENTS.md docs python_helper scripts
      - name: Prepare final code commit
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch .audit-overlay
          git add -A
          git reset -- \
            .github/workflows/deterministic-ci.yml \
            .github/workflows/apply-final-audit-overlay-temp.yml \
            .github/workflows/source-snapshot-audit-temp.yml || true
          git status --short
          test -n "$(git diff --cached --name-only)"
      - name: Create final code commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --stat
          git commit -m "fix: close final deterministic audit blockers"
      - name: Push final code commit
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin "HEAD:$branch"
