name: Diagnose corrected final fragments

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'fix/decouple-mix-allocation-from-w'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
          fetch-depth: 1
          show-progress: false

      - name: Compare corrected fragment hashes
        run: |
          set -euo pipefail
          cat > /tmp/expected.txt <<'EOF'
          fix01-0 c77a566f4fbd225bbf5fd613ce14d836ec4ca136
          fix01-1 3248a88af701e97656814223fe0d580874fb3f78
          fix03-0 a036c12e5fd5a423a0d0f57fc342f60b0b5e1f66
          fix03-1 d5140c8f267c8791d82071ab86f813590bb55e38
          fix04-0 c3c04d36e319f4250163a6e7e7c74e9a9de4facb
          fix04-1 e7987d2b44c67485685d7f9d009fb984942e878c
          fix07-0 8c93235c1a0c5176c0bb4e566f259a5d9500284c
          fix07-1 8e84610e0c9e0a9966ad8d51eaf4c63a3a94c849
          fix08-0 c34774fe536c7cf4de6ca757e7bd01153c956c01
          fix08-1 4c4ddfdb2611986879775b7d22ac952949ecb6d0
          fix09-0 fdab596f27a11ca2b943d000ec367d95b52dd022
          fix09-1 f9f4ce4c7accc1568151fd765985329003018e54
          EOF
          : > /tmp/corrected-fragment-hashes.txt
          while read -r name expected; do
            path=".delivery-final/$name"
            actual="$(git hash-object "$path")"
            printf '%s expected=%s actual=%s match=%s\n' \
              "$name" "$expected" "$actual" "$([ "$actual" = "$expected" ] && echo yes || echo no)" \
              >> /tmp/corrected-fragment-hashes.txt
          done < /tmp/expected.txt
          cat /tmp/corrected-fragment-hashes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: corrected-fragment-hashes
          path: /tmp/corrected-fragment-hashes.txt
          if-no-files-found: error
          retention-days: 1
