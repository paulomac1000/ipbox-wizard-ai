name: Deterministic CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  checks: write

concurrency:
  group: deterministic-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-review-fixes:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/consolidate-pr-review-fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout review branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/consolidate-pr-review-fixes
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Apply verified review fixes
        run: python .github/apply_pr8_review.py

      - name: Validate review fixes
        run: |
          set -euo pipefail
          ruff format tests/unit/test_final_benchmark_gate.py tests/unit/test_paid_recording_safety.py
          ruff check tests/unit/test_final_benchmark_gate.py tests/unit/test_paid_recording_safety.py
          python -m compileall -q tests
          pytest -q tests/unit/test_final_benchmark_gate.py tests/unit/test_paid_recording_safety.py

      - name: Commit clean review fixes
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/deterministic-ci.yml > .github/workflows/deterministic-ci.yml
          rm -f .github/workflows/apply-pr8-review-test-hardening.yml
          rm -f .github/review-hardening-trigger.tmp
          rm -f .github/apply_pr8_review.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: harden paid and workflow safety regressions"
          git push origin HEAD:agent/consolidate-pr-review-fixes

  deterministic:
    needs: apply-review-fixes
    if: always() && (needs.apply-review-fixes.result == 'success' || needs.apply-review-fixes.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Ruff format
        run: |
          mkdir -p reports
          if ! ruff format --check .; then
            ruff format --diff . > reports/ruff-format.diff
            exit 1
          fi

      - name: Ruff lint
        run: |
          set -o pipefail
          mkdir -p reports
          ruff check . 2>&1 | tee reports/ruff-lint.txt

      - name: Compile Python
        run: python -m compileall -q python_helper tests scripts

      - name: Unit tests with coverage
        run: |
          mkdir -p reports
          pytest tests/unit \
            --cov=python_helper \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage-py${{ matrix.python-version }}.xml \
            --cov-fail-under=90 \
            --junitxml=reports/unit-py${{ matrix.python-version }}.xml

      - name: Full free suite (skip paid LLM)
        run: pytest -q

      - name: Shell syntax check
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Cassette policy
        run: |
          set -o pipefail
          mkdir -p reports
          python scripts/check_cassette_policy.py 2>&1 | tee reports/cassette-policy.txt

      - name: Complete cassette gate and offline playback
        if: matrix.python-version == '3.13'
        env:
          VCR_MODE: playback
        run: |
          set -euo pipefail
          unset OPENROUTER_API_KEY || true
          python scripts/benchmark_report.py --output reports/benchmark-summary.json
          ./scripts/verify_all_models.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-reports-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14