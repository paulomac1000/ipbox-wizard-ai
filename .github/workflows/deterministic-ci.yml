name: Diagnose normalized final fragments

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'fix/decouple-mix-allocation-from-w'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
          fetch-depth: 1
          show-progress: false

      - name: Compare normalized corrected fragments
        run: |
          set -euo pipefail
          cat > /tmp/expected.txt <<'EOF'
          fix01-0 86689f3b92d45f248efb9aa21067d7b9047a2b63f5b90def396834ac13fcbf2c
          fix01-1 4a20c55df459b37859144816aa358dcf3a46b881b25d58910b9137860d470c45
          fix03-0 2493d8a7305a16ed202eb6db5b522942fd9b092c1a2d65a56a635cddf1aea208
          fix03-1 a9673b49f55eb60a8da53c8695fd917cd1d36b78b0d93bba7e661812f3ee0a5c
          fix04-0 1a7a94c37e081831da7a36de4700e1c6809e1ba7e32eb3712cca235d1950a4b6
          fix04-1 e380a4ce6e944f6465ab37d8dbc36c2dea8f22648a06c994b45b1c055ce203f7
          fix07-0 33d3ca87cc07e640ac3b764c1a7b68dc8e320b9b98dbefb1b85199826add9482
          fix07-1 58b664d3eadf1502aa1434af63d0b047712dea1f7b2a17734a036402e42489e0
          fix08-0 b3eb2346d130b4374a875bfa2a860cc4561019599cc034272d766197badfeefc
          fix08-1 4615abe18f7878b56d6401fbaeb52d720635861970e26e0528f0e635774cea0b
          fix09-0 270a6dce2e42f9c5b7c411694583aaf43e50bb7d953dc05a3c91199f5bc3a8cf
          fix09-1 bae68b94ee9c87040764b5ca90716d6fe2171a7c2a93bfc946305a0298a672c6
          EOF
          : > /tmp/normalized-fragment-hashes.txt
          while read -r name expected; do
            path=".delivery-final/$name"
            actual="$(tr -d '[:space:]' < "$path" | sha256sum | awk '{print $1}')"
            bytes="$(tr -d '[:space:]' < "$path" | wc -c)"
            printf '%s bytes=%s expected=%s actual=%s match=%s\n' \
              "$name" "$bytes" "$expected" "$actual" "$([ "$actual" = "$expected" ] && echo yes || echo no)" \
              >> /tmp/normalized-fragment-hashes.txt
          done < /tmp/expected.txt
          cat /tmp/normalized-fragment-hashes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: normalized-fragment-hashes
          path: /tmp/normalized-fragment-hashes.txt
          if-no-files-found: error
          retention-days: 1
