name: Publish reviewed LLM decision contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-reviewed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.head_ref == 'fix/decouple-mix-allocation-from-w' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
          fetch-depth: 1
          show-progress: false

      - name: Reconstruct reviewed source
        run: |
          set -euo pipefail
          cat \
            .delivery-final/part-00 \
            .delivery-final/fix01-* \
            .delivery-final/part-02 \
            .delivery-final/fix03-* \
            .delivery-final/fix04-* \
            .delivery-final/part-05 \
            .delivery-final/part-06 \
            .delivery-final/fix07-* \
            .delivery-final/fix08-* \
            .delivery-final/fix09-* \
            .delivery-final/part-10 \
            > /tmp/ipbox-final.b64
          base64 --decode /tmp/ipbox-final.b64 > /tmp/ipbox-final.tar.gz
          echo "81700578e14043d07df7a425a0e83560d107e906d0c042c57432124d64b19d00  /tmp/ipbox-final.tar.gz" | sha256sum -c -

          rm -rf /tmp/reviewed-tree
          mkdir -p /tmp/reviewed-tree
          python3 - <<'PY'
          import tarfile
          from pathlib import Path

          root = Path('/tmp/reviewed-tree').resolve()
          with tarfile.open('/tmp/ipbox-final.tar.gz', 'r:gz') as archive:
              for member in archive.getmembers():
                  target = (root / member.name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f'unsafe archive path: {member.name}')
              archive.extractall(root)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: /tmp/reviewed-tree
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Ruff format
        working-directory: /tmp/reviewed-tree
        run: ruff format --check .

      - name: Ruff lint
        working-directory: /tmp/reviewed-tree
        run: ruff check .

      - name: Compile Python
        working-directory: /tmp/reviewed-tree
        run: python -m compileall -q python_helper tests scripts

      - name: Unit tests and coverage
        working-directory: /tmp/reviewed-tree
        run: |
          pytest tests/unit \
            --cov=python_helper \
            --cov-report=term-missing \
            --cov-fail-under=90

      - name: Full free suite
        working-directory: /tmp/reviewed-tree
        run: pytest -q

      - name: Cassette policy
        working-directory: /tmp/reviewed-tree
        run: python scripts/check_cassette_policy.py

      - name: Shell syntax
        working-directory: /tmp/reviewed-tree
        run: |
          set -euo pipefail
          for script in scripts/*.sh dump-to-md.sh; do
            bash -n "$script"
          done

      - name: Replace code while preserving current workflows
        run: |
          set -euo pipefail
          rm -rf /tmp/current-workflows
          mkdir -p /tmp/current-workflows
          cp -a .github/workflows/. /tmp/current-workflows/

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/reviewed-tree/. .

          mkdir -p .github/workflows
          cp -a /tmp/current-workflows/. .github/workflows/

      - name: Commit reviewed production code
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: simplify LLM decision contract and remove stale cassettes"
          git push origin HEAD:fix/decouple-mix-allocation-from-w
