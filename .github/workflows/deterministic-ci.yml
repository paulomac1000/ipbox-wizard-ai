name: Publish locally verified review fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-reviewed-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.head_ref == 'fix/decouple-mix-allocation-from-w' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
          fetch-depth: 0

      - name: Reconstruct and apply reviewed patch
        run: |
          set -euo pipefail
          cat .review-fix/part-* | tr -d '[:space:]' > /tmp/ipbox-review-fixes.patch.gz.b64
          base64 --decode /tmp/ipbox-review-fixes.patch.gz.b64 > /tmp/ipbox-review-fixes.patch.gz
          echo "da95498d242005876207448e96b3d840c45ea3036d04ded08ed9c13b677b5284  /tmp/ipbox-review-fixes.patch.gz" | sha256sum -c -
          gzip -dc /tmp/ipbox-review-fixes.patch.gz > /tmp/ipbox-review-fixes.patch

          git show 9c2fc756573d735feb27305fff22fd275da8794f:.github/workflows/deterministic-ci.yml \
            > .github/workflows/deterministic-ci.yml
          git apply --check /tmp/ipbox-review-fixes.patch
          git apply /tmp/ipbox-review-fixes.patch
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Run complete deterministic gates
        run: |
          set -euo pipefail
          ruff format --check .
          ruff check .
          python -m compileall -q python_helper tests scripts
          pytest tests/unit \
            --cov=python_helper \
            --cov-report=term-missing \
            --cov-fail-under=90
          pytest -q
          python scripts/check_cassette_policy.py
          for script in scripts/*.sh dump-to-md.sh; do
            bash -n "$script"
          done

      - name: Commit and push final code
        run: |
          set -euo pipefail
          rm -rf .review-fix
          rm -f .github/workflows/publish-review-fixes.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: address deterministic and bot review findings"
          git push origin HEAD:fix/decouple-mix-allocation-from-w
