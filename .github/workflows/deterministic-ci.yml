name: Deterministic CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

concurrency:
  group: deterministic-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-legacy-model-count-test:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/openai-model-family'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/openai-model-family
          persist-credentials: true
      - name: Update the legacy seven-family assertion once
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/unit/test_vcr_and_client.py")
          text = path.read_text(encoding="utf-8")
          old = '''def test_model_profiles_cover_seven_distinct_families() -> None:
              assert BENCHMARK_MODELS == (
                  "google/gemini-3-flash-preview",
                  "anthropic/claude-haiku-4.5",
                  "deepseek/deepseek-chat-v3.1",
                  "minimax/minimax-m2.5",
                  "moonshotai/kimi-k2.5",
                  "qwen/qwen3.5-flash-02-23",
                  "mistralai/mistral-small-24b-instruct-2501",
              )
              assert len({get_model_profile(model).family for model in BENCHMARK_MODELS}) == 7
          '''
          new = '''def test_model_profiles_cover_eight_distinct_families() -> None:
              assert BENCHMARK_MODELS == (
                  "google/gemini-3-flash-preview",
                  "anthropic/claude-haiku-4.5",
                  "deepseek/deepseek-chat-v3.1",
                  "minimax/minimax-m2.5",
                  "moonshotai/kimi-k2.5",
                  "qwen/qwen3.5-flash-02-23",
                  "mistralai/mistral-small-24b-instruct-2501",
                  "openai/gpt-5-mini",
              )
              assert len({get_model_profile(model).family for model in BENCHMARK_MODELS}) == 8
          '''
          if old not in text:
              print("Legacy assertion already absent; no change needed")
              raise SystemExit(0)
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          if git diff --quiet -- tests/unit/test_vcr_and_client.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/test_vcr_and_client.py
          git commit -m "test: update benchmark family expectations"
          git push origin HEAD:feat/openai-model-family

  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Ruff format
        run: |
          mkdir -p reports
          if ! ruff format --check .; then
            ruff format --diff . > reports/ruff-format.diff
            exit 1
          fi

      - name: Ruff lint
        run: |
          set -o pipefail
          mkdir -p reports
          ruff check . 2>&1 | tee reports/ruff-lint.txt

      - name: Compile Python
        run: python -m compileall -q python_helper tests scripts

      - name: Unit tests with coverage
        run: |
          mkdir -p reports
          pytest tests/unit \
            --cov=python_helper \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage-py${{ matrix.python-version }}.xml \
            --cov-fail-under=90 \
            --junitxml=reports/unit-py${{ matrix.python-version }}.xml

      - name: Full free suite (skip paid LLM)
        run: pytest -q

      - name: Shell syntax check
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Cassette policy
        run: |
          set -o pipefail
          mkdir -p reports
          python scripts/check_cassette_policy.py 2>&1 | tee reports/cassette-policy.txt

      - name: Complete cassette gate and offline playback
        if: matrix.python-version == '3.13'
        env:
          VCR_MODE: playback
        run: |
          set -euo pipefail
          unset OPENROUTER_API_KEY || true
          python scripts/benchmark_report.py --output reports/benchmark-summary.json
          ./scripts/verify_all_models.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-reports-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
