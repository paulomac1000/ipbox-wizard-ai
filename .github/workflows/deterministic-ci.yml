name: Deterministic CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deterministic-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Checkout pinned AI skills validators
        if: matrix.python-version == '3.12'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: paulomac1000/ai-skills
          ref: e4e858b29471bf530b8ca46a509425f70b793a90
          path: .ai-skills-source
          fetch-depth: 1
          persist-credentials: false

      - name: Validate adopted AI skills
        if: matrix.python-version == '3.12'
        run: |
          set -euo pipefail
          mkdir -p reports
          test "$(git -C .ai-skills-source rev-parse HEAD)" = \
            "e4e858b29471bf530b8ca46a509425f70b793a90"
          rm -rf "$RUNNER_TEMP/ai-skills"
          mv .ai-skills-source "$RUNNER_TEMP/ai-skills"
          ai_skills="$RUNNER_TEMP/ai-skills"
          workflow_policy="$ai_skills/skills/ci-cd-architect/tools/check_github_actions_policy.py"
          cmp scripts/check_workflow_policy.py "$workflow_policy"
          python "$workflow_policy" . 2>&1 | tee reports/workflow-policy.txt
          python "$ai_skills/skills/agents-md-architect/tools/audit_agents_md.py" \
            --strict \
            --layout single \
            --profile safety-critical \
            --language pl \
            . 2>&1 | tee reports/agents-md-audit.txt
          python "$ai_skills/skills/agents-md-architect/tools/validate_agents_md.py" \
            --strict \
            --repository-root . \
            --layout single \
            --profile safety-critical \
            --language pl \
            AGENTS.md 2>&1 | tee reports/agents-md-validation.txt
          python "$ai_skills/skills/afds-doc-writer/validate.py" \
            docs/agent-development.md \
            docs/agent-tax-analysis.md \
            2>&1 | tee reports/afds-validation.txt

      - name: Ruff format
        run: |
          set -euo pipefail
          mkdir -p reports
          if ! ruff format --check .; then
            ruff format --diff . > reports/ruff-format.diff
            exit 1
          fi

      - name: Ruff lint
        run: |
          set -euo pipefail
          mkdir -p reports
          ruff check . 2>&1 | tee reports/ruff-lint.txt

      - name: Compile Python
        run: python -m compileall -q python_helper tests scripts

      - name: Security and runtime dependency audit
        if: matrix.python-version == '3.12'
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m bandit -q -lll -iii -r python_helper scripts \
            2>&1 | tee reports/bandit.txt
          python -m pip_audit -r requirements.txt \
            2>&1 | tee reports/pip-audit.txt

      - name: Unit tests with coverage
        run: |
          set -euo pipefail
          mkdir -p reports
          pytest tests/unit \
            --cov=python_helper \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage-py${{ matrix.python-version }}.xml \
            --cov-fail-under=90 \
            --junitxml=reports/unit-py${{ matrix.python-version }}.xml

      - name: Full free suite (skip paid LLM)
        run: pytest -q

      - name: Shell syntax check
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Cassette policy
        run: |
          set -euo pipefail
          mkdir -p reports
          python scripts/check_cassette_policy.py 2>&1 | tee reports/cassette-policy.txt

      - name: Complete cassette gate and offline playback
        if: matrix.python-version == '3.13'
        env:
          VCR_MODE: playback
        run: |
          set -euo pipefail
          unset OPENROUTER_API_KEY
          python scripts/benchmark_report.py --output reports/benchmark-summary.json
          ./scripts/verify_all_models.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deterministic-reports-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
