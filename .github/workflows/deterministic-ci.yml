name: Diagnose reviewed tree transport

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'fix/decouple-mix-allocation-from-w'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
          fetch-depth: 1
          show-progress: false

      - name: Compare fragment hashes
        run: |
          set -euo pipefail
          cat > /tmp/expected.txt <<'EOF'
          part-00 6fb9a940969971b3e2e43c4b78ef0fbe050fe486
          part-01 11a50241dc331ed11441650a0ea56ad7fdc54982
          part-02 1e104ee502245c2b1812eed935da178491662f5f
          part-03 37a9eb942ea4afe1890e979146443873e74df67c
          part-04 b674723cfd432671070d36cb3174b54a1df029ab
          part-05 34a8002e0ffbd2fde889b49de2137f1ee492297b
          part-06 6f561ce82f08bb0c721534134959f8506cae3424
          part-07 770e773815bfaec8eebb3dc8945436b59be99c22
          part-08 f82d245dde32f76f36b62751b8e9d740d5b03dba
          part-09 8720ae527231dddd0ea9598cb8e520ed2836a40e
          part-10 012a63f5a8c0a49ce52c5579a527a03c0b20f857
          EOF
          : > /tmp/fragment-hashes.txt
          while read -r name expected; do
            path=".delivery-final/$name"
            actual="$(git hash-object "$path")"
            bytes="$(wc -c < "$path")"
            printf '%s bytes=%s expected=%s actual=%s match=%s\n' \
              "$name" "$bytes" "$expected" "$actual" "$([ "$actual" = "$expected" ] && echo yes || echo no)" \
              >> /tmp/fragment-hashes.txt
          done < /tmp/expected.txt
          cat /tmp/fragment-hashes.txt

      - name: Upload fragment report
        uses: actions/upload-artifact@v4
        with:
          name: final-fragment-hashes
          path: /tmp/fragment-hashes.txt
          if-no-files-found: error
          retention-days: 1
