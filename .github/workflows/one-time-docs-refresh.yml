name: One-time documentation refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: one-time-docs-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.head_ref == 'fix/decouple-mix-allocation-from-w'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Refresh documentation counters and source paths
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              '.agents/onboarding.md': [
                  ('Kontrakt zweryfikowano 17 lipca 2026 r. dla scenariuszy 2025; reguły zależne od roku muszą mieć urzędowe źródło i test.',
                   'Kontrakt roczny zweryfikowano 18 lipca 2026 r. dla wszystkich lat obowiązywania IP Box 2019–2026; każdy kolejny rok musi mieć urzędowe źródło i test.'),
                  ('252/252 dla siedmiu rodzin', '322/322 dla siedmiu rodzin'),
                  ('kompletną macierz 252/252', 'kompletną macierz 322/322'),
                  ('181 testów PASS, coverage 94,32%, 36 kontrolowanych skipów LLM',
                   '255 testów jednostkowych PASS, coverage 94,74%, 46 kontrolowanych skipów LLM'),
              ],
              'AGENTS.md': [
                  ('2. `python_helper/ipbox_calculator.py` — deterministyczna matematyka.\n3. `tests/llm/oracle.py` — wynik referencyjny harnessu.\n4. `tests/llm/output_schema.py` — kontrakt raportu.',
                   '2. `python_helper/ipbox_calculator.py`, `tax_year_rules.py` i `allocation_audit.py` — deterministyczna matematyka, reguły roczne i strażniki alokacji.\n3. `tests/llm/oracle_v2.py` — wynik referencyjny harnessu.\n4. `tests/llm/output_schema_v2.py` — kontrakt raportu.'),
                  ('- alokacje zachowują każdy grosz;', '- alokacje zachowują każdy grosz;\n- testy i scenariusze nie zawierają danych osobowych ani rzeczywistych kwot podatnika;'),
                  ('252/252', '322/322'),
                  ('36/36', '46/46'),
                  ('Stan bazowy po audycie protokołu: 184 testy, 94,32% coverage, 36 kontrolowanych skipów LLM.',
                   'Stan bazowy po rozszerzeniu regresji: 255 testów jednostkowych, 94,74% coverage i 46 kontrolowanych skipów LLM.'),
              ],
              'docs/testing.md': [
                  ('184 testy jednostkowe PASS;', '255 testów jednostkowych PASS;'),
                  ('coverage `python_helper` 94,32%;', 'coverage `python_helper` 94,74%;'),
                  ('pełny suite: 184 PASS i 36 kontrolowanych skipów LLM;', 'pełny suite: wszystkie bezpłatne testy PASS i 46 kontrolowanych skipów LLM;'),
                  ('**252 kasety: 7 modeli × 36 scenariuszy**', '**322 kasety: 7 modeli × 46 scenariuszy**'),
                  ('Model zalicza tylko przy 36/36, a cała macierz przy 252/252.', 'Model zalicza tylko przy 46/46, a cała macierz przy 322/322.'),
                  ('35/36 jest diagnostyką', '45/46 jest diagnostyką'),
                  ('Repo dopuszcza brak kaset albo kompletną aktualną macierz 7 × 36.', 'Repo dopuszcza brak kaset albo kompletną aktualną macierz 7 × 46.'),
                  ('skopiuj dziewięć katalogów', 'skopiuj siedem katalogów'),
                  ('- miesiące muszą odpowiadać `input.rok`, a termomodernizacja nie przekracza 53 000 zł.',
                   '- miesiące muszą odpowiadać `input.rok`, a termomodernizacja nie przekracza 53 000 zł;\n- jawna semantyka W odróżnia iloczyn warunkowy, rozłączne składniki i sam czas;\n- podwójny procent faktury oraz nieudokumentowana zmiana metody w roku aktywują STOP;\n- ewidencja i zeznanie uzgadniają się osobno w IP/NIE nawet przy równych sumach globalnych;\n- reguły roczne 2019–2026 obejmują IKZE, zdrowotną, skalę i granicę jednoczesnego B+R/IP Box.'),
              ],
              'README.md': [
                  ('Audyt techniczny i semantyczny wykonano 17 lipca 2026 r.; scenariusze referencyjne dotyczą 2025 r., a zakodowane limity 2026 są jawnie wersjonowane.',
                   'Audyt techniczny i semantyczny wykonano 18 lipca 2026 r.; reguły podatkowe są jawnie wersjonowane dla wszystkich lat obowiązywania IP Box 2019–2026.'),
                  ('1. `python_helper/ipbox_calculator.py` waliduje dane i liczy W, alokacje, NEXUS, ulgi, podatek oraz zaokrąglenia.\n2. `tests/llm/oracle.py` tworzy niezależny wynik referencyjny i atomowe `decision_facts`.',
                   '1. `python_helper/ipbox_calculator.py`, `tax_year_rules.py` i `allocation_audit.py` walidują dane, liczą W, alokacje, NEXUS, reguły roczne, ulgi i podatek.\n2. `tests/llm/oracle_v2.py` tworzy niezależny wynik referencyjny i atomowe `decision_facts`.'),
                  ('Stan po audycie protokołu: **184 testy PASS**, coverage `python_helper` **94,32%**; pełny bezpłatny suite: **184 PASS i 36 kontrolowanych skipów LLM**.',
                   'Stan po rozszerzeniu regresji: **255 testów jednostkowych PASS**, coverage `python_helper` **94,74%**; pełny bezpłatny suite i 46 kontrolowanych przypadków LLM przechodzą na Pythonie 3.11–3.13.'),
                  ('Benchmark używa dziewięciu tanich modeli z dziewięciu niezależnych rodzin:', 'Benchmark używa siedmiu modeli z siedmiu niezależnych rodzin:'),
                  ('Repo zawiera kompletną macierz 252/252 ścisłych odpowiedzi JSON. PR pozostaje **draftem** do końcowego review.',
                   'Stara macierz została usunięta po zmianie oracle, schematu i scenariuszy. Repo celowo zawiera pusty katalog kaset; przed review trzeba nagrać od zera macierz 322 odpowiedzi. PR pozostaje **draftem**.'),
                  ('36/36 kaset dla każdego z siedmiu modeli, czyli 252 aktualne nagrania;', '46/46 kaset dla każdego z siedmiu modeli, czyli 322 aktualne nagrania;'),
              ],
              'docs/model-diversity-benchmark.md': [
                  ('## Aktualna macierz 7 × 36', '## Aktualna macierz 7 × 46'),
                  ('Łącznie wydanie wymaga **252 kaset** i dziewięciu manifestów. Każdy model musi\nosiągnąć 36/36.',
                   'Łącznie wydanie wymaga **322 kaset** i siedmiu manifestów. Każdy model musi\nosiągnąć 46/46.'),
              ],
              'docs/independent-audit-brief.md': [
                  ('252/252', '322/322'),
                  ('181 testów PASS, coverage co najmniej 94,32%, 36 kontrolowanych skipów LLM',
                   '255 testów jednostkowych PASS, coverage co najmniej 94,74%, 46 kontrolowanych skipów LLM'),
                  ('Nagraj wszystkie 252 kasety od nowa.', 'Nagraj wszystkie 322 kasety od nowa.'),
                  ('wszystkie siedem modeli ma 36/36, a macierz ma dokładnie 324 aktualne kasety.',
                   'wszystkie siedem modeli ma 46/46, a macierz ma dokładnie 322 aktualne kasety.'),
                  ('Wynik 36/36 dla każdego z siedmiu modeli', 'Wynik 46/46 dla każdego z siedmiu modeli'),
                  ('kontrolę 252 kaset', 'kontrolę 322 kaset'),
                  ('17. zgodność każdego pliku Markdown z kodem.',
                   '17. zgodność każdego pliku Markdown z kodem;\n18. jawne semantyki W i blokadę podwójnego procentu;\n19. uzgodnienie kategorii IP/NIE pomiędzy ewidencją i zeznaniem;\n20. reguły roczne 2019–2026 i syntetyczne scenariusze 46–55.'),
              ],
          }

          changed = []
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(filename)
          print('Changed:', ', '.join(changed))
          if not changed:
              raise SystemExit('no documentation files changed')
          PY
      - name: Commit documentation refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'docs: align release guidance with 46 scenarios'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
