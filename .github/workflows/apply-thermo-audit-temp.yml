name: Apply thermomodernization and recording audit fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-thermo-audit-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: pip install -q -r requirements.txt -r requirements-test.txt

      - name: Apply audited patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one match in {path}, found {text.count(old)}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          def append_once(path: str, marker: str, addition: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if marker in text:
                  return
              target.write_text(text.rstrip() + "\n\n" + addition.strip() + "\n", encoding="utf-8")

          replace_once(
              "python_helper/tax_year_rules.py",
              "    source_ids: tuple[str, ...]\n",
              "    source_ids: tuple[str, ...]\n"
              "    thermomodernization_limit: Decimal = Decimal(\"53000\")\n"
              "    thermomodernization_source_id: str = \"MF_THERMOMODERNIZATION\"\n",
          )
          replace_once(
              "python_helper/tax_year_rules.py",
              "        if self.remaining_amount < 0:\n"
              "            raise ValueError(\"thermomodernization remaining_amount must be non-negative\")\n",
              "        amount = money(self.remaining_amount)\n"
              "        object.__setattr__(self, \"remaining_amount\", amount)\n"
              "        if not isinstance(self.evidence_ref, str):\n"
              "            raise ValueError(\"thermomodernization evidence_ref must be a string\")\n"
              "        evidence_ref = self.evidence_ref.strip()\n"
              "        if amount > 0 and not evidence_ref:\n"
              "            raise ValueError(\"positive thermomodernization lot requires evidence_ref\")\n"
              "        object.__setattr__(self, \"evidence_ref\", evidence_ref)\n",
          )
          replace_once(
              "python_helper/tax_year_rules.py",
              "    tax_year = strict_year(tax_year, \"tax_year\")\n"
              "    get_tax_year_rules(tax_year)\n",
              "    tax_year = strict_year(tax_year, \"tax_year\")\n"
              "    rules = get_tax_year_rules(tax_year)\n",
          )
          replace_once(
              "python_helper/tax_year_rules.py",
              "                evidence_ref=str(raw.get(\"evidence_ref\", \"\")),\n",
              "                evidence_ref=raw.get(\"evidence_ref\", \"\"),\n",
          )
          replace_once(
              "python_helper/tax_year_rules.py",
              "    if opening_total > Decimal(\"53000\"):\n"
              "        raise ValueError(\"thermomodernization lots exceed the 53000 PLN taxpayer limit\")\n",
              "    if opening_total > rules.thermomodernization_limit:\n"
              "        raise ValueError(\n"
              "            \"thermomodernization lots exceed the \"\n"
              "            f\"{rules.thermomodernization_limit} PLN taxpayer limit\"\n"
              "        )\n",
          )
          replace_once(
              "python_helper/tax_year_rules.py",
              "    return {\n"
              "        \"used\": float(money(used_total)),\n",
              "    return {\n"
              "        \"mode\": \"evidence_lots\",\n"
              "        \"evidence_status\": \"VERIFIED\",\n"
              "        \"rules_source_id\": rules.thermomodernization_source_id,\n"
              "        \"limit\": float(rules.thermomodernization_limit),\n"
              "        \"used\": float(money(used_total)),\n",
          )

          replace_once(
              "python_helper/tax_cascade.py",
              "    if values[\"thermomodernization_pool\"] > Decimal(\"53000\"):\n"
              "        raise ValueError(\"thermomodernization_pool cannot exceed 53000 PLN\")\n",
              "    if values[\"thermomodernization_pool\"] > rules.thermomodernization_limit:\n"
              "        raise ValueError(\n"
              "            \"thermomodernization_pool cannot exceed \"\n"
              "            f\"{rules.thermomodernization_limit} PLN\"\n"
              "        )\n",
          )
          replace_once(
              "python_helper/tax_cascade.py",
              "    if thermomodernization_lots is not None and values[\"thermomodernization_pool\"] > 0:\n"
              "        raise ValueError(\"use thermomodernization_pool or thermomodernization_lots, not both\")\n\n"
              "    rd_ip_used = min(values[\"rd_relief_ip\"], values[\"ip_income\"])\n",
              "    if thermomodernization_lots is not None and values[\"thermomodernization_pool\"] > 0:\n"
              "        raise ValueError(\"use thermomodernization_pool or thermomodernization_lots, not both\")\n"
              "    if thermomodernization_lots is not None:\n"
              "        thermomodernization_mode = \"evidence_lots\"\n"
              "        thermomodernization_evidence_status = \"VERIFIED\"\n"
              "    elif values[\"thermomodernization_pool\"] > 0:\n"
              "        thermomodernization_mode = \"legacy_pool\"\n"
              "        thermomodernization_evidence_status = \"PROVISIONAL\"\n"
              "    else:\n"
              "        thermomodernization_mode = \"none\"\n"
              "        thermomodernization_evidence_status = \"NOT_APPLICABLE\"\n\n"
              "    rd_ip_used = min(values[\"rd_relief_ip\"], values[\"ip_income\"])\n",
          )
          replace_once(
              "python_helper/tax_cascade.py",
              "        \"thermomodernization_carry_over\": float(money(thermo_carry)),\n",
              "        \"thermomodernization_carry_over\": float(money(thermo_carry)),\n"
              "        \"thermomodernization_mode\": thermomodernization_mode,\n"
              "        \"thermomodernization_evidence_status\": (\n"
              "            thermomodernization_evidence_status\n"
              "        ),\n"
              "        \"thermomodernization_rules_source_id\": (\n"
              "            rules.thermomodernization_source_id\n"
              "        ),\n"
              "        \"thermomodernization_limit\": float(rules.thermomodernization_limit),\n",
          )

          replace_once(
              "tests/llm/oracle_guards.py",
              "    \"contribution_classification_requires_review\": \"REVIEW_21\",\n",
              "    \"contribution_classification_requires_review\": \"REVIEW_21\",\n"
              "    \"legacy_thermomodernization_pool_requires_review\": \"REVIEW_22\",\n",
          )
          replace_once(
              "tests/llm/oracle_guards.py",
              "        \"termomodernization_carry_over\": 0.0,\n"
              "        \"termomodernization_expired\": 0.0,\n",
              "        \"termomodernization_carry_over\": 0.0,\n"
              "        \"termomodernization_expired\": 0.0,\n"
              "        \"thermomodernization_mode\": \"none\",\n"
              "        \"thermomodernization_evidence_status\": \"NOT_APPLICABLE\",\n"
              "        \"thermomodernization_rules_source_id\": \"MF_THERMOMODERNIZATION\",\n"
              "        \"thermomodernization_limit\": 53000.0,\n",
          )

          replace_once(
              "tests/llm/oracle.py",
              "        \"termomodernization_carry_over\": tax[\"thermomodernization_carry_over\"],\n"
              "        \"termomodernization_expired\": tax[\"thermomodernization_expired\"],\n",
              "        \"termomodernization_carry_over\": tax[\"thermomodernization_carry_over\"],\n"
              "        \"termomodernization_expired\": tax[\"thermomodernization_expired\"],\n"
              "        \"thermomodernization_mode\": tax[\"thermomodernization_mode\"],\n"
              "        \"thermomodernization_evidence_status\": (\n"
              "            tax[\"thermomodernization_evidence_status\"]\n"
              "        ),\n"
              "        \"thermomodernization_rules_source_id\": (\n"
              "            tax[\"thermomodernization_rules_source_id\"]\n"
              "        ),\n"
              "        \"thermomodernization_limit\": tax[\"thermomodernization_limit\"],\n",
          )
          replace_once(
              "tests/llm/oracle.py",
              "    facts[\"source_coverage_incomplete\"] = not coverage_complete\n"
              "    facts[\"no_qualifying_ip_income_after_complete_evidence\"] = bool(\n",
              "    facts[\"source_coverage_incomplete\"] = not coverage_complete\n"
              "    reliefs = input_data.get(\"ulgi\", {})\n"
              "    facts[\"legacy_thermomodernization_pool_requires_review\"] = bool(\n"
              "        isinstance(reliefs, Mapping)\n"
              "        and reliefs.get(\"termomodernizacja_loty\") is None\n"
              "        and number(\n"
              "            reliefs.get(\"termomodernizacja_pula\", 0),\n"
              "            \"ulgi.termomodernizacja_pula\",\n"
              "        )\n"
              "        > 0\n"
              "    )\n"
              "    facts[\"no_qualifying_ip_income_after_complete_evidence\"] = bool(\n",
          )
          replace_once(
              "tests/llm/oracle.py",
              "        \"contribution_classification_requires_review\",\n"
              "    }\n",
              "        \"contribution_classification_requires_review\",\n"
              "        \"legacy_thermomodernization_pool_requires_review\",\n"
              "    }\n",
          )

          replace_once(
              "tests/llm/output_schema.py",
              "for code in (\"REVIEW_18\", \"REVIEW_19\", \"REVIEW_20\", \"REVIEW_21\"):\n",
              "for code in (\"REVIEW_18\", \"REVIEW_19\", \"REVIEW_20\", \"REVIEW_21\", \"REVIEW_22\"):\n",
          )
          replace_once(
              "tests/llm/output_schema.py",
              "    _tax[\"properties\"][field] = deepcopy(legacy.NONNEGATIVE_MONEY)\n\n"
              "_classification = _report_root[\"properties\"][\"classifications\"][\"items\"]\n",
              "    _tax[\"properties\"][field] = deepcopy(legacy.NONNEGATIVE_MONEY)\n\n"
              "for field in (\n"
              "    \"thermomodernization_mode\",\n"
              "    \"thermomodernization_evidence_status\",\n"
              "    \"thermomodernization_rules_source_id\",\n"
              "    \"thermomodernization_limit\",\n"
              "):\n"
              "    if field not in _tax[\"required\"]:\n"
              "        _tax[\"required\"].append(field)\n"
              "_tax[\"properties\"][\"thermomodernization_mode\"] = {\n"
              "    \"enum\": [\"none\", \"legacy_pool\", \"evidence_lots\"]\n"
              "}\n"
              "_tax[\"properties\"][\"thermomodernization_evidence_status\"] = {\n"
              "    \"enum\": [\"NOT_APPLICABLE\", \"PROVISIONAL\", \"VERIFIED\"]\n"
              "}\n"
              "_tax[\"properties\"][\"thermomodernization_rules_source_id\"] = {\n"
              "    \"type\": \"string\",\n"
              "    \"minLength\": 1,\n"
              "}\n"
              "_tax[\"properties\"][\"thermomodernization_limit\"] = deepcopy(\n"
              "    legacy.NONNEGATIVE_MONEY\n"
              ")\n\n"
              "_classification = _report_root[\"properties\"][\"classifications\"][\"items\"]\n",
          )

          replace_once(
              "tests/llm/scenarios/27_termomodernizacja_full.yaml",
              "  ulgi:\n"
              "    termomodernizacja_pula: 53000\n"
              "    ikze: 2000\n",
              "  ulgi:\n"
              "    termomodernizacja_loty:\n"
              "    - origin_year: 2025\n"
              "      remaining_amount: 53000\n"
              "      evidence_ref: synthetic-thermo-27-2025\n"
              "    ikze: 2000\n",
          )
          replace_once(
              "tests/llm/scenarios/28_edge_multiple_carry-overs.yaml",
              "  ulgi:\n"
              "    termomodernizacja_pula: 15000\n"
              "    ikze: 2000\n",
              "  ulgi:\n"
              "    termomodernizacja_loty:\n"
              "    - origin_year: 2022\n"
              "      remaining_amount: 7000\n"
              "      evidence_ref: synthetic-thermo-28-2022\n"
              "    - origin_year: 2024\n"
              "      remaining_amount: 8000\n"
              "      evidence_ref: synthetic-thermo-28-2024\n"
              "    ikze: 2000\n",
          )

          replace_once(
              "tests/unit/test_tax_year_rules.py",
              "    assert (float(rules.health_linear_limit) if rules.health_linear_limit else None) == health\n",
              "    assert (float(rules.health_linear_limit) if rules.health_linear_limit else None) == health\n"
              "    assert float(rules.thermomodernization_limit) == 53000\n"
              "    assert rules.thermomodernization_source_id == \"MF_THERMOMODERNIZATION\"\n",
          )
          replace_once(
              "tests/unit/test_tax_year_rules.py",
              "            {\"origin_year\": 2022, \"remaining_amount\": 2000},\n"
              "            {\"origin_year\": 2024, \"remaining_amount\": 2000},\n",
              "            {\n"
              "                \"origin_year\": 2022,\n"
              "                \"remaining_amount\": 2000,\n"
              "                \"evidence_ref\": \"thermo-2022\",\n"
              "            },\n"
              "            {\n"
              "                \"origin_year\": 2024,\n"
              "                \"remaining_amount\": 2000,\n"
              "                \"evidence_ref\": \"thermo-2024\",\n"
              "            },\n",
          )
          replace_once(
              "tests/unit/test_tax_year_rules.py",
              "                {\"origin_year\": 2023, \"remaining_amount\": 30000},\n"
              "                {\"origin_year\": 2024, \"remaining_amount\": 23000.01},\n",
              "                {\n"
              "                    \"origin_year\": 2023,\n"
              "                    \"remaining_amount\": 30000,\n"
              "                    \"evidence_ref\": \"thermo-limit-2023\",\n"
              "                },\n"
              "                {\n"
              "                    \"origin_year\": 2024,\n"
              "                    \"remaining_amount\": 23000.01,\n"
              "                    \"evidence_ref\": \"thermo-limit-2024\",\n"
              "                },\n",
          )
          append_once(
              "tests/unit/test_tax_year_rules.py",
              "def test_positive_thermomodernization_lot_requires_evidence",
              '''
          def test_positive_thermomodernization_lot_requires_evidence() -> None:
              from python_helper.tax_year_rules import ThermomodernizationLot

              with pytest.raises(ValueError, match="requires evidence_ref"):
                  ThermomodernizationLot(origin_year=2025, remaining_amount=1)


          def test_thermomodernization_result_exposes_rule_source_and_mode() -> None:
              result = calculate_tax_for_year(
                  2025,
                  non_ip_income=3000,
                  ip_income=10000,
                  nexus=1,
                  tax_form="liniowy_19%",
                  thermomodernization_lots=[
                      {
                          "origin_year": 2025,
                          "remaining_amount": 1000,
                          "evidence_ref": "thermo-2025",
                      }
                  ],
              )
              assert result["thermomodernization_mode"] == "evidence_lots"
              assert result["thermomodernization_evidence_status"] == "VERIFIED"
              assert result["thermomodernization_rules_source_id"] == "MF_THERMOMODERNIZATION"
              assert result["thermomodernization_limit"] == 53000.0
          ''',
          )

          replace_once(
              "tests/unit/test_final_audit_regressions.py",
              "import json\n",
              "import json\nimport os\nimport time\n",
          )
          replace_once(
              "tests/unit/test_final_audit_regressions.py",
              "from scripts.check_cassette_policy import main as cassette_policy_main\n",
              "from scripts.check_cassette_policy import main as cassette_policy_main\n"
              "from scripts.record_model import paid_cost_since, select_scenarios\n",
          )
          replace_once(
              "tests/unit/test_final_audit_regressions.py",
              "from tests.llm.runner import LLMTestRunner, build_tool_context\n",
              "from tests.llm.runner import LLMTestRunner, build_tool_context\n"
              "from tests.llm.test_scenarios import discover_scenarios\n",
          )
          append_once(
              "tests/unit/test_final_audit_regressions.py",
              "def test_paid_recording_scenario_selection_is_exact",
              '''
          def test_paid_recording_scenario_selection_is_exact(
              monkeypatch: pytest.MonkeyPatch,
              tmp_path: Path,
          ) -> None:
              paths = [tmp_path / "0.yaml", tmp_path / "01.yaml"]
              for path in paths:
                  path.write_text("meta: {}\n", encoding="utf-8")
              assert select_scenarios(paths, "0") == [tmp_path / "0.yaml"]
              with pytest.raises(ValueError, match="No exact scenario"):
                  select_scenarios(paths, "missing")

              monkeypatch.setenv("IPBOX_SCENARIO", "0")
              with pytest.raises(RuntimeError, match="no exact scenario"):
                  discover_scenarios()
              monkeypatch.delenv("IPBOX_SCENARIO")


          def test_global_paid_cost_counts_accepted_and_rejected_calls(tmp_path: Path) -> None:
              started = time.time() - 10
              cassette_root = tmp_path / "cassettes"
              model_dir = cassette_root / "model-a"
              model_dir.mkdir(parents=True)
              (model_dir / "accepted.yaml").write_text(
                  "meta:\n  cost: 0.20\nresponse: ok\nparsed_response: {}\n",
                  encoding="utf-8",
              )
              rejected_root = tmp_path / "rejected"
              rejected_dir = rejected_root / "model-a"
              rejected_dir.mkdir(parents=True)
              (rejected_dir / "rejected.json").write_text(
                  json.dumps({"metadata": {"cost": 0.30}}),
                  encoding="utf-8",
              )
              assert paid_cost_since(
                  cassette_root,
                  rejected_root,
                  since=started,
              ) == pytest.approx(0.50)
              assert paid_cost_since(
                  cassette_root,
                  rejected_root,
                  since=started,
                  model="model-a",
              ) == pytest.approx(0.50)


          def test_legacy_thermomodernization_pool_is_explicitly_provisional() -> None:
