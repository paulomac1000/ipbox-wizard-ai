name: Apply final audit fixes temporary

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: final-audit-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Apply verified source patch
        run: |
          set -euo pipefail
          cat .audit/final-patch-part-*.b64 | base64 --decode | gzip --decompress > /tmp/source-fixes.patch
          git apply --check /tmp/source-fixes.patch
          git apply /tmp/source-fixes.patch
          rm -f scripts/.source-snapshot-trigger

      - name: Format and lint
        run: |
          set -euo pipefail
          ruff format .
          ruff check . --fix
          ruff format .
          ruff format --check .
          ruff check .

      - name: Remove legacy numeric cassette markers before canonical refresh
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          root = Path("tests/llm/vcr/cassettes")
          changed = 0
          for path in sorted(root.glob("*/*.yaml")):
              if path.name == "_manifest.yaml":
                  continue
              payload = yaml.safe_load(path.read_text(encoding="utf-8"))
              if not isinstance(payload, dict) or not isinstance(payload.get("meta"), dict):
                  raise SystemExit(f"invalid cassette structure before refresh: {path}")
              if payload["meta"].pop("cassette_format_version", None) is not None:
                  path.write_text(
                      yaml.safe_dump(payload, allow_unicode=True, sort_keys=False, width=120),
                      encoding="utf-8",
                  )
                  changed += 1
          print(f"Removed legacy numeric marker from {changed} cassette(s)")
          PY

      - name: Refresh cassette metadata without API calls
        env:
          OPENROUTER_API_KEY: ""
        run: |
          set -euo pipefail
          unset OPENROUTER_API_KEY || true
          python scripts/refresh_vcr_metadata.py --all-models --write

      - name: Compile Python
        run: python -m compileall -q python_helper tests scripts

      - name: Unit tests with coverage
        run: |
          set -euo pipefail
          mkdir -p reports
          pytest -q tests/unit --tb=short --cov=python_helper --cov-report=term-missing --cov-fail-under=90 > reports/final-audit-unit.txt 2>&1 || {
            cat reports/final-audit-unit.txt
            exit 1
          }

      - name: Upload unit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-audit-unit-${{ github.run_id }}
          path: reports/final-audit-unit.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Full free suite
        run: pytest -q

      - name: Shell syntax
        run: |
          set -euo pipefail
          for script in scripts/*.sh dump-to-md.sh; do bash -n "$script"; done

      - name: VCR pre-commit
        env:
          OPENROUTER_API_KEY: ""
        run: |
          set -euo pipefail
          unset OPENROUTER_API_KEY || true
          python scripts/vcr_precommit.py --all-models

      - name: Cassette policy
        run: python scripts/check_cassette_policy.py

      - name: Benchmark report
        run: python scripts/benchmark_report.py

      - name: Offline playback
        env:
          OPENROUTER_API_KEY: ""
        run: |
          set -euo pipefail
          unset OPENROUTER_API_KEY || true
          ./scripts/verify_all_models.sh

      - name: Publish verified durable files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .audit .github/workflows/source-snapshot-temp.yml .github/workflows/apply-final-audit-temp.yml
          if git diff --cached --quiet; then
            echo "No durable changes to publish"
            exit 0
          fi
          git commit -m "fix: close final tax and VCR audit gaps"
          git push origin HEAD:fix/decouple-mix-allocation-from-w
