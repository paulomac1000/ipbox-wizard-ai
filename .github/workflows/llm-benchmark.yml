name: Paid multi-model LLM benchmark

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_PAID_BENCHMARK to confirm paid requests"
        required: true
        type: string
      model:
        description: "Benchmark model (or 'all' for the full eight-family matrix)"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "google/gemini-3-flash-preview"
          - "anthropic/claude-haiku-4.5"
          - "deepseek/deepseek-chat-v3.1"
          - "minimax/minimax-m2.5"
          - "moonshotai/kimi-k2.5"
          - "qwen/qwen3.5-flash-02-23"
          - "mistralai/mistral-small-24b-instruct-2501"
          - "openai/gpt-5-mini"
      max-cost-per-model-usd:
        description: "Required positive per-model paid-cost guard in USD"
        required: true
        type: string
        default: "5"
      max-total-cost-usd:
        description: "Required positive whole-run paid-cost guard in USD"
        required: true
        type: string
        default: "5"

permissions:
  contents: read

concurrency:
  group: llm-benchmark-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  benchmark:
    if: inputs.confirmation == 'RUN_PAID_BENCHMARK'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LLM_PROVIDER: openrouter
      LLM_PAID_RUN_CONFIRMATION: ${{ inputs.confirmation }}
      BENCHMARK_MODEL: ${{ inputs.model }}
      MAX_COST_PER_MODEL_USD: ${{ inputs.max-cost-per-model-usd }}
      MAX_TOTAL_COST_USD: ${{ inputs.max-total-cost-usd }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pinned AI skills policy auditor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: paulomac1000/ai-skills
          ref: a43c61902af015dfe7b830e281c7a87f9ac8e420
          path: .ai-skills-source
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize isolated rejected-attempt path
        run: |
          set -euo pipefail
          rejected_root="$RUNNER_TEMP/ipbox_llm_rejected_${GITHUB_RUN_ID}"
          printf 'VCR_REJECTED_ROOT=%s\n' "$rejected_root" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Validate trusted workflow policy
        run: |
          set -euo pipefail
          test "$(git -C .ai-skills-source rev-parse HEAD)" = \
            "a43c61902af015dfe7b830e281c7a87f9ac8e420"
          rm -rf "$RUNNER_TEMP/ai-skills"
          mv .ai-skills-source "$RUNNER_TEMP/ai-skills"
          workflow_policy="$RUNNER_TEMP/ai-skills/skills/ci-cd-architect/tools/check_github_actions_policy.py"
          workflow_policy_impl="$RUNNER_TEMP/ai-skills/skills/ci-cd-architect/tools/check_github_actions_policy_impl.py"
          cmp scripts/check_workflow_policy.py "$workflow_policy"
          cmp scripts/check_github_actions_policy_impl.py "$workflow_policy_impl"
          python scripts/check_workflow_policy.py .
          python "$workflow_policy" .

      - name: Validate API key and cost guards
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import math
          import os
          import sys

          for name in ("MAX_COST_PER_MODEL_USD", "MAX_TOTAL_COST_USD"):
              raw = os.environ.get(name, "").strip()
              try:
                  value = float(raw)
              except ValueError as exc:
                  print(f"::error::{name} must be a number, got {raw!r}", file=sys.stderr)
                  raise SystemExit(1) from exc
              if not math.isfinite(value) or value <= 0:
                  print(
                      f"::error::{name} must be finite and > 0, got {value}",
                      file=sys.stderr,
                  )
                  raise SystemExit(1)
              print(f"{name}: ${value:.6f}")
          PY
          test -n "$OPENROUTER_API_KEY" || {
            echo "::error::OPENROUTER_API_KEY secret is not configured"
            exit 1
          }

      - name: Deterministic gates before paid calls
        run: |
          set -euo pipefail
          ruff format --check .
          ruff check .
          python -m compileall -q python_helper tests scripts
          python -m bandit -q -lll -iii -r python_helper scripts
          python -m pip_audit -r requirements.txt
          pytest tests/unit \
            --cov=python_helper \
            --cov-report=term-missing \
            --cov-fail-under=90
          pytest -q
          for script in scripts/*.sh; do bash -n "$script"; done

      - name: Record cassettes
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p reports
          rm -rf "$VCR_REJECTED_ROOT"
          mkdir -p "$VCR_REJECTED_ROOT"
          if [ "$BENCHMARK_MODEL" = "all" ]; then
            ./scripts/record_all_models.sh \
              --max-cost-per-model-usd "$MAX_COST_PER_MODEL_USD" \
              --max-total-cost-usd "$MAX_TOTAL_COST_USD"
          else
            python scripts/record_model.py \
              --model "$BENCHMARK_MODEL" \
              --max-cost-per-model-usd "$MAX_COST_PER_MODEL_USD" \
              --max-total-cost-usd "$MAX_TOTAL_COST_USD"
          fi

      - name: Offline verification (no API key)
        run: |
          set -euo pipefail
          unset OPENROUTER_API_KEY
          if [ "$BENCHMARK_MODEL" = "all" ]; then
            ./scripts/verify_all_models.sh
            python scripts/vcr_precommit.py --all-models
            python scripts/check_cassette_policy.py
          else
            PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            LLM_PROVIDER=openrouter \
            LLM_MODEL="$BENCHMARK_MODEL" \
            VCR_MODE=playback \
            python -m pytest tests/llm/test_scenarios.py --run-llm --vcr-mode=playback -q
            python scripts/vcr_precommit.py --model "$BENCHMARK_MODEL"
            python scripts/benchmark_report.py --model "$BENCHMARK_MODEL"
          fi

      - name: Collect diagnostics
        if: always()
        run: |
          set -euo pipefail
          mkdir -p reports/rejected reports/responses
          cp -a "$VCR_REJECTED_ROOT"/. reports/rejected/ 2>/dev/null || true
          cp -a /tmp/ipbox_llm_responses/. reports/responses/ 2>/dev/null || true

      - name: Upload cassette candidates and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llm-benchmark-${{ github.run_id }}
          path: |
            tests/llm/vcr/cassettes/
            reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Require a complete matrix for all-model runs
        if: inputs.model == 'all'
        run: |
          set -euo pipefail
          python scripts/check_cassette_policy.py
