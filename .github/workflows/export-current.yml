name: Export current branch

on:
  push:
    branches: [fix/decouple-mix-allocation-from-w]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build source archive
        run: git archive --format=tar.gz --output=/tmp/ipbox-current.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ipbox-current-source
          path: /tmp/ipbox-current.tar.gz
          if-no-files-found: error
          retention-days: 1
