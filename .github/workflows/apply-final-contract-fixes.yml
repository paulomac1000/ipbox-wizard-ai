name: Apply final contract fixes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply reviewed patch
        run: python .patch2/apply.py

      - name: Remove bootstrap files
        run: |
          rm -rf .patch2
          rm -f .github/workflows/apply-final-contract-fixes.yml

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Validate final tree
        run: |
          set -euo pipefail
          ruff format --check .
          ruff check .
          python -m compileall -q python_helper tests
          pytest tests/unit \
            --cov=python_helper \
            --cov-report=term-missing \
            --cov-fail-under=90

      - name: Commit final tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align LLM contract and allocation edge cases"
          git push origin HEAD:fix/decouple-mix-allocation-from-w
