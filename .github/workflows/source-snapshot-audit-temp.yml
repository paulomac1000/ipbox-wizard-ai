name: Source snapshot for final audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/decouple-mix-allocation-from-w

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false
      - name: Archive exact tracked source
        run: git archive --format=zip --output=source-snapshot.zip HEAD
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot-${{ github.sha }}
          path: source-snapshot.zip
          if-no-files-found: error
          retention-days: 1
