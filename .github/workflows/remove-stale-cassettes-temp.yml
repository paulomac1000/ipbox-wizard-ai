name: Remove stale cassette matrix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Remove invalidated recordings
        run: |
          set -euo pipefail
          rm -rf tests/llm/vcr/cassettes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests/llm/vcr/cassettes
          if git diff --cached --quiet; then
            echo "No cassette files remain"
          else
            git commit -m "test: remove stale LLM cassette matrix"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
