name: Apply final audit fixes

on:
  push:
    branches:
      - fix/decouple-mix-allocation-from-w
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: final-audit-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
          fetch-depth: 0

      - name: Apply reviewed source bundle and remove scaffolding
        run: |
          set -euo pipefail
          cat .audit/final-fix.part-* > /tmp/final-fix.tar.gz.b64
          echo 'd2cf1cb70ae42b5f7d16c6d9bb099a2697f9f13a2d1311f2f6b77f5a26e60ba3  /tmp/final-fix.tar.gz.b64' \
            | sha256sum --check --strict
          base64 --decode /tmp/final-fix.tar.gz.b64 | tar -xzf -
          rm -f /tmp/final-fix.tar.gz.b64
          rm -rf .audit
          rm -f .github/workflows/final-source-audit-temp.yml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Format before refreshing VCR identity
        run: |
          set -euo pipefail
          ruff format .
          ruff check .
          python -m compileall -q python_helper tests scripts

      - name: Refresh existing cassette metadata without API calls
        run: |
          set -euo pipefail
          unset OPENROUTER_API_KEY || true
          python scripts/refresh_vcr_metadata.py --all-models --write

      - name: Run complete deterministic and offline release gates
        run: |
          set -euo pipefail
          ruff format --check .
          ruff check .
          python -m compileall -q python_helper tests scripts
          pytest tests/unit \
            --cov=python_helper \
            --cov-report=term-missing \
            --cov-fail-under=90
          pytest -q
          for script in scripts/*.sh dump-to-md.sh; do bash -n "$script"; done
          python scripts/check_cassette_policy.py
          python scripts/vcr_precommit.py --all-models
          python scripts/benchmark_report.py
          unset OPENROUTER_API_KEY || true
          ./scripts/verify_all_models.sh

      - name: Verify clean canonical repository layout
        run: |
          set -euo pipefail
          test ! -e .audit
          test ! -e .github/workflows/final-source-audit-temp.yml
          if find . -path ./.git -prune -o -type f \
              \( -iname '*.tmp' -o -iname '*.bak' -o -iname '*.orig' -o -iname '*.rej' \) \
              -print | grep -q .; then
            echo 'Unexpected temporary artifact found' >&2
            exit 1
          fi
          if rg -n -i '\bv(2|3|7|8)(\.[0-9]+)?\b' \
              --glob '!tests/llm/vcr/cassettes/**' . \
              | grep -vE 'deepseek-chat-v3\.1|deepseek_deepseek_chat_v3_1'; then
            echo 'Unexpected internal numbered version remains' >&2
            exit 1
          fi

      - name: Commit verified final tree
        run: |
          set -euo pipefail
          rm -rf .pytest_cache .coverage reports
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close final paid benchmark safety gaps'
          git push origin HEAD:fix/decouple-mix-allocation-from-w
