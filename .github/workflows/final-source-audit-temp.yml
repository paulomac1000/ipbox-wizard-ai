name: Publish verified final audit tree

on:
  push:
    branches:
      - fix/decouple-mix-allocation-from-w
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: final-audit-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
          fetch-depth: 0

      - name: Recreate already verified tree
        run: |
          set -euo pipefail
          cat .audit/final-fix.part-* > /tmp/final-fix.tar.gz.b64
          echo 'd2cf1cb70ae42b5f7d16c6d9bb099a2697f9f13a2d1311f2f6b77f5a26e60ba3  /tmp/final-fix.tar.gz.b64' \
            | sha256sum --check --strict
          base64 --decode /tmp/final-fix.tar.gz.b64 | tar -xzf -
          rm -rf .audit /tmp/final-fix.tar.gz.b64

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Reproduce formatting and cassette identity
        run: |
          set -euo pipefail
          pip install -r requirements.txt -r requirements-test.txt
          ruff format .
          ruff check .
          unset OPENROUTER_API_KEY || true
          python scripts/refresh_vcr_metadata.py --all-models --write
          python scripts/check_cassette_policy.py
          python scripts/vcr_precommit.py --all-models

      - name: Create and publish commit
        id: publish
        continue-on-error: true
        run: |
          set +e
          mkdir -p reports
          {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            rm -rf .pytest_cache .coverage
            find . -type d -name __pycache__ -prune -exec rm -rf {} +
            find . -type f -name '*.pyc' -delete
            git add -A
            git status --short
            git diff --cached --check
            git commit -m 'fix: close final paid benchmark safety gaps'
            commit_status=$?
            echo "commit_status=$commit_status"
            if [ "$commit_status" -eq 0 ]; then
              git rev-parse HEAD
              git push --force origin HEAD:refs/heads/automation/final-ipbox-audit
              push_status=$?
            else
              push_status=99
            fi
            echo "push_status=$push_status"
            exit "$push_status"
          } > reports/publish.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload publication diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: final-audit-publication
          path: reports/publish.log
          if-no-files-found: error
          retention-days: 2

      - name: Enforce publication result
        run: test '${{ steps.publish.outputs.status }}' = '0'
