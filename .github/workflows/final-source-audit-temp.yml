name: Final source audit snapshot

on:
  push:
    branches:
      - fix/decouple-mix-allocation-from-w
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > FINAL_AUDIT_HEAD_SHA
          git ls-files -z | tar --null -czf final-source.tar.gz -T -
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: final-source-audit
          path: |
            final-source.tar.gz
            FINAL_AUDIT_HEAD_SHA
          if-no-files-found: error
          retention-days: 2
