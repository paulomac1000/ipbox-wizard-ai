name: Rebuild canonical VCR matrix

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type REBUILD_322_CASSETTES to confirm paid recording"
        required: true
        type: string
      max_cost_per_model_usd:
        description: "Per-model paid-cost guard in USD"
        required: true
        default: "5"
        type: string
      max_total_cost_usd:
        description: "Whole-run paid-cost guard in USD"
        required: true
        default: "5"
        type: string

permissions:
  contents: write

concurrency:
  group: rebuild-canonical-vcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record-verify-publish:
    if: inputs.confirmation == 'REBUILD_322_CASSETTES'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LLM_PROVIDER: openrouter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: pip install -q -r requirements.txt -r requirements-test.txt

      - name: Validate secret and deterministic source
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY" || {
            echo "::error::OPENROUTER_API_KEY secret is not configured"
            exit 1
          }
          ruff format --check .
          ruff check .
          python -m compileall -q python_helper tests scripts
          pytest tests/unit --cov=python_helper --cov-report=term-missing --cov-fail-under=90
          pytest -q
          for script in scripts/*.sh dump-to-md.sh; do bash -n "$script"; done
          python scripts/check_cassette_policy.py

      - name: Record full seven-family matrix
        env:
          VCR_REJECTED_ROOT: /tmp/ipbox_llm_rejected
        run: |
          set -euo pipefail
          rm -rf tests/llm/vcr/cassettes "$VCR_REJECTED_ROOT"
          mkdir -p tests/llm/vcr/cassettes "$VCR_REJECTED_ROOT"
          ./scripts/record_all_models.sh \
            --max-cost-per-model-usd "${{ inputs.max_cost_per_model_usd }}" \
            --max-total-cost-usd "${{ inputs.max_total_cost_usd }}"

      - name: Verify complete matrix offline
        run: |
          set -euo pipefail
          unset OPENROUTER_API_KEY
          ./scripts/verify_all_models.sh
          python scripts/vcr_precommit.py --all-models
          python scripts/check_cassette_policy.py
          mkdir -p reports
          python scripts/benchmark_report.py --output reports/benchmark-summary.json

      - name: Publish verified matrix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/llm/vcr/cassettes
          test -n "$(git diff --cached --name-only)"
          git diff --cached --stat
          git commit -m "test: rebuild canonical LLM cassette matrix"
          git push origin HEAD:fix/decouple-mix-allocation-from-w

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p reports/rejected reports/responses
          cp -a /tmp/ipbox_llm_rejected/. reports/rejected/ 2>/dev/null || true
          cp -a /tmp/ipbox_llm_responses/. reports/responses/ 2>/dev/null || true

      - name: Upload matrix and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-vcr-${{ github.run_id }}
          path: |
            tests/llm/vcr/cassettes/
            reports/
          if-no-files-found: warn
          retention-days: 30
