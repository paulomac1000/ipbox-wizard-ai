name: Refresh VCR metadata artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Refresh derived metadata without API access
        env:
          VCR_MODE: playback
        run: |
          set -euo pipefail
          unset OPENROUTER_API_KEY || true
          python scripts/refresh_vcr_metadata.py --all-models --write
          python scripts/check_cassette_policy.py

      - name: Commit refreshed cassette metadata
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/llm/vcr/cassettes; then
            echo "Cassette metadata is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/llm/vcr/cassettes
          git commit -m "test(vcr): refresh cassette metadata for path resolver"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Upload refreshed cassette tree
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-vcr-cassettes
          path: tests/llm/vcr/cassettes
          if-no-files-found: error
          retention-days: 1
