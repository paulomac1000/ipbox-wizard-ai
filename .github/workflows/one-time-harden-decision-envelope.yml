name: One-time decision-envelope hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: one-time-decision-envelope-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  harden:
    if: github.head_ref == 'fix/decouple-mix-allocation-from-w'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Harden protocol and remove stale cassettes
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          def replace_once(filename: str, old: str, new: str) -> None:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"missing replacement in {filename}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "tests/llm/runner.py",
              '''SYSTEM_PROMPT = (
              "You execute an already evaluated list of active rules. Python has already "
              "decided which predicates are true. Every supplied active_rule is active; "
              "every absent rule is inactive. Do not infer tax facts or add rules. Copy only "
              "the supplied codes into a strict JSON object, with no Markdown fences."
          )''',
              '''SYSTEM_PROMPT = (
              "You copy an authoritative decision envelope already produced by Python. "
              "The supplied expected_decision contains the final status, STOP codes, and "
              "REVIEW codes. Copy every field exactly. Never reclassify, move, suppress, "
              "infer, or add codes. STOP and REVIEW channels remain independent even when "
              "status is STOPPED. Return a strict JSON object with no Markdown fences."
          )''',
          )

          replace_once(
              "tests/llm/runner.py",
              '''def build_tool_context(reference: dict[str, Any]) -> dict[str, Any]:
              """Expose only true, authoritative rules; never show inactive facts to the model."""
              facts = reference["decision_facts"]
              active_rules: list[dict[str, str]] = []
              for kind, mapping in (("STOP", STOP_FACT_TO_CODE), ("REVIEW", REVIEW_FACT_TO_CODE)):
                  active_rules.extend(
                      {"kind": kind, "code": code}
                      for fact, code in mapping.items()
                      if facts.get(fact) is True
                  )
              return {"active_rules": active_rules}''',
              '''def build_tool_context(reference: dict[str, Any]) -> dict[str, Any]:
              """Expose only the authoritative decision envelope; never expose tax facts."""
              stops = sorted(reference["stops_reviews"]["stops"])
              reviews = sorted(reference["stops_reviews"]["reviews"])
              expected_status = "STOPPED" if stops else "FINAL"
              if reference["status"] != expected_status:
                  raise ValueError(
                      "oracle status is inconsistent with its authoritative STOP channel"
                  )
              return {
                  "expected_decision": {
                      "status": expected_status,
                      "stops": stops,
                      "reviews": reviews,
                  }
              }''',
          )

          replace_once(
              "tests/llm/runner.py",
              '''        [
                      "DECISION PROTOCOL:",
                      "- active_rules contains only rules already evaluated as true by Python.",
                      "- Copy each STOP code to stops and each REVIEW code to reviews.",
                      "- Do not invent, omit, or duplicate any code.",
                      "- status is STOPPED when at least one STOP rule exists; otherwise FINAL.",
                      "- For an empty active_rules list return status=FINAL, stops=[], reviews=[].",
                      "- Return one pure JSON object only. Do not use Markdown fences.",
                  ]''',
              '''        [
                      "DECISION PROTOCOL:",
                      "- expected_decision is the complete authoritative result produced by Python.",
                      "- Copy expected_decision.status exactly to status.",
                      "- Copy expected_decision.stops exactly to stops.",
                      "- Copy expected_decision.reviews exactly to reviews.",
                      "- A STOP never moves, suppresses, or converts a REVIEW code.",
                      "- Do not invent, omit, duplicate, or reclassify any code.",
                      "- Return one pure JSON object only. Do not use Markdown fences.",
                  ]''',
          )

          replace_once(
              "tests/llm/runner.py",
              '"ACTIVE RULES (all are true):\\n"',
              '"AUTHORITATIVE DECISION ENVELOPE (copy exactly):\\n"',
          )

          replace_once(
              "tests/llm/output_schema.py",
              '''CODE = {"type": "string", "pattern": "^[A-Z][A-Z0-9_]*$"}
          ''',
              '''CODE = {"type": "string", "pattern": "^[A-Z][A-Z0-9_]*$"}
          LEGACY_STOP_CODES = [
              "STOP_01",
              "STOP_02",
              "STOP_03",
              "STOP_04",
              "STOP_08",
              "ZUS_DOUBLE_DIP",
              "HEALTH_DOUBLE_DIP",
          ]
          REVIEW_CODES = [
              "REVIEW_01",
              "REVIEW_02",
              "REVIEW_04",
              "REVIEW_08",
              "REVIEW_09",
              "REVIEW_16",
              "REVIEW_17",
          ]
          STOP_CODE = {"type": "string", "enum": LEGACY_STOP_CODES}
          REVIEW_CODE = {"type": "string", "enum": REVIEW_CODES}
          ''',
          )

          replace_once(
              "tests/llm/output_schema.py",
              '''            "stops": {"type": "array", "items": CODE},
                      "reviews": {"type": "array", "items": CODE},''',
              '''            "stops": {"type": "array", "items": STOP_CODE, "uniqueItems": True},
                      "reviews": {"type": "array", "items": REVIEW_CODE, "uniqueItems": True},''',
          )

          replace_once(
              "tests/llm/output_schema_v2.py",
              '''DECISION_JSON_SCHEMA: dict[str, Any] = deepcopy(legacy.DECISION_JSON_SCHEMA)
          OUTPUT_JSON_SCHEMA: dict[str, Any] = deepcopy(legacy.OUTPUT_JSON_SCHEMA)
          
          _result = OUTPUT_JSON_SCHEMA["schema"]["properties"]["result"]["properties"]''',
              '''DECISION_JSON_SCHEMA: dict[str, Any] = deepcopy(legacy.DECISION_JSON_SCHEMA)
          OUTPUT_JSON_SCHEMA: dict[str, Any] = deepcopy(legacy.OUTPUT_JSON_SCHEMA)
          
          _stop_codes = DECISION_JSON_SCHEMA["schema"]["properties"]["stops"]["items"]["enum"]
          for code in (
              "STOP_09",
              "STOP_10",
              "STOP_11",
              "STOP_12",
              "STOP_13",
              "STOP_14",
              "STOP_15",
              "STOP_16",
          ):
              if code not in _stop_codes:
                  _stop_codes.append(code)
          
          _result = OUTPUT_JSON_SCHEMA["schema"]["properties"]["result"]["properties"]''',
          )

          replace_once(
              "tests/llm/models.py",
              '''    "minimax/minimax-m2.5": ModelProfile(
                  model_id="minimax/minimax-m2.5",
                  label="MiniMax M2.5",
                  family="MiniMax",
              ),''',
              '''    "minimax/minimax-m2.5": ModelProfile(
                  model_id="minimax/minimax-m2.5",
                  label="MiniMax M2.5",
                  family="MiniMax",
                  temperature=0.0,
              ),''',
          )

          replace_once(
              "tests/unit/test_scenarios_and_evaluator.py",
              'from tests.llm.output_schema import OUTPUT_JSON_SCHEMA',
              'from tests.llm.output_schema import DECISION_JSON_SCHEMA, OUTPUT_JSON_SCHEMA',
          )

          old_tests = '''def test_runner_exposes_only_active_decision_rules() -> None:
              import json
          
              loaded = scenario("01_basic_linear")
              reference = compute_reference(loaded)
              expected = []
              for kind, mapping in (("STOP", STOP_FACT_TO_CODE), ("REVIEW", REVIEW_FACT_TO_CODE)):
                  expected.extend(
                      {"kind": kind, "code": code}
                      for fact, code in mapping.items()
                      if reference["decision_facts"].get(fact) is True
                  )
              context = build_tool_context(reference)
              assert context == {"active_rules": expected}
          
              serialized = json.dumps(context, ensure_ascii=False)
              assert "claimed_ip_without_qualified_right" not in serialized
              assert "STOP_02" not in serialized
              assert "REVIEW_09" in serialized
          
              prompt = LLMTestRunner(None).build_prompt("ignored human documentation", loaded)
              assert "ACTIVE RULES" in prompt
              assert "deterministic_report" not in prompt
              assert '"result"' not in prompt
              assert "active_rules" in prompt
              assert "claimed_ip_without_qualified_right" not in prompt
              assert "STOP_02" not in prompt
              assert "single_positive_revenue_client" not in prompt
              assert "status, stops, and reviews" in prompt
          
          
          def test_decision_protocol_describes_copying_active_rules_only() -> None:
              protocol = build_decision_protocol()
              assert "active_rules contains only rules" in protocol
              assert "Do not invent, omit, or duplicate" in protocol
              assert "status is STOPPED" in protocol
              assert "Markdown fences" in protocol
              assert "unsupported_tax_form" not in protocol
              assert "STOP_01" not in protocol
          
          
          def test_active_rules_include_stop_only_when_the_stop_fact_is_true() -> None:
              final_context = build_tool_context(compute_reference(scenario("01_basic_linear")))
              stopped_context = build_tool_context(
                  compute_reference(scenario("14_lump_sum_ineligible_check"))
              )
              assert not any(item["kind"] == "STOP" for item in final_context["active_rules"])
              assert {item["code"] for item in stopped_context["active_rules"] if item["kind"] == "STOP"} == {
                  "STOP_01"
              }
          '''

          new_tests = '''def test_runner_exposes_only_authoritative_decision_envelope() -> None:
              import json
          
              loaded = scenario("51_return_ledger_classification_shift_stop")
              reference = compute_reference(loaded)
              context = build_tool_context(reference)
              assert context == {
                  "expected_decision": {
                      "status": "STOPPED",
                      "stops": ["STOP_12"],
                      "reviews": ["REVIEW_09"],
                  }
              }
          
              serialized = json.dumps(context, ensure_ascii=False)
              assert "return_ledger_reconciliation_failed" not in serialized
              assert "single_positive_revenue_client" not in serialized
              assert "decision_facts" not in serialized
          
              prompt = LLMTestRunner(None).build_prompt("ignored human documentation", loaded)
              assert "AUTHORITATIVE DECISION ENVELOPE" in prompt
              assert "expected_decision" in prompt
              assert "active_rules" not in prompt
              assert "deterministic_report" not in prompt
              assert '"result"' not in prompt
              assert "return_ledger_reconciliation_failed" not in prompt
              assert "single_positive_revenue_client" not in prompt
          
          
          def test_decision_protocol_keeps_stop_and_review_channels_independent() -> None:
              protocol = build_decision_protocol()
              assert "Copy expected_decision.stops exactly" in protocol
              assert "Copy expected_decision.reviews exactly" in protocol
              assert "A STOP never moves, suppresses, or converts a REVIEW code" in protocol
              assert "Do not invent, omit, duplicate, or reclassify" in protocol
              assert "Markdown fences" in protocol
              assert "STOP_01" not in protocol
              assert "REVIEW_09" not in protocol
          
          
          def test_decision_schema_rejects_cross_channel_codes() -> None:
              validator = Draft202012Validator(DECISION_JSON_SCHEMA["schema"])
              review_in_stops = {
                  "status": "STOPPED",
                  "stops": ["STOP_12", "REVIEW_09"],
                  "reviews": [],
              }
              stop_in_reviews = {
                  "status": "STOPPED",
                  "stops": ["STOP_12"],
                  "reviews": ["STOP_12"],
              }
              assert list(validator.iter_errors(review_in_stops))
              assert list(validator.iter_errors(stop_in_reviews))
          
          
          def test_authoritative_envelope_preserves_empty_and_nonempty_stop_channels() -> None:
              final_context = build_tool_context(compute_reference(scenario("01_basic_linear")))
              stopped_context = build_tool_context(
                  compute_reference(scenario("14_lump_sum_ineligible_check"))
              )
              assert final_context["expected_decision"]["stops"] == []
              assert final_context["expected_decision"]["status"] == "FINAL"
              assert stopped_context["expected_decision"]["stops"] == ["STOP_01"]
              assert stopped_context["expected_decision"]["status"] == "STOPPED"
          '''
          replace_once("tests/unit/test_scenarios_and_evaluator.py", old_tests, new_tests)

          replace_once(
              "AGENTS.md",
              '- model dostaje tylko aktywne reguły (`true`) i zwraca wyłącznie `status`, `stops`, `reviews`;',
              '- Python buduje pełną autorytatywną kopertę `expected_decision`; model kopiuje bez zmian wyłącznie `status`, `stops`, `reviews`;',
          )
          replace_once(
              "AGENTS.md",
              '- fakt lub kod nieaktywny nie może pojawić się w promptcie modelu;',
              '- fakty podatkowe i nazwy predykatów nie mogą pojawić się w promptcie modelu; kanały STOP i REVIEW są rozdzielone także w JSON Schema;',
          )
          replace_once(
              "AGENTS.md",
              'Stan bazowy po rozszerzeniu regresji: 255 testów jednostkowych, 94,74% coverage i 46 kontrolowanych skipów LLM.',
              'Stan bazowy po rozszerzeniu regresji: co najmniej 255 testów jednostkowych, coverage powyżej wymaganych 90% i 46 kontrolowanych skipów LLM. Dokładne wartości raportuje CI.',
          )

          replace_once(
              "README.md",
              '3. Runner usuwa wszystkie fakty `false` i przekazuje modelowi wyłącznie aktywne reguły z gotowym kodem STOP/REVIEW.\n4. LLM kopiuje kody aktywnych reguł do małej koperty `status/stops/reviews`; nie widzi reguł nieaktywnych.',
              '3. Python składa kompletną autorytatywną kopertę `expected_decision` z rozdzielonymi kanałami STOP i REVIEW.\n4. LLM kopiuje bez zmian `status/stops/reviews`; nie klasyfikuje kodów i nie widzi faktów podatkowych ani nazw predykatów.',
          )
          replace_once(
              "README.md",
              'Stan po rozszerzeniu regresji: **255 testów jednostkowych PASS**, coverage `python_helper` **94,74%**; pełny bezpłatny suite i 46 kontrolowanych przypadków LLM przechodzą na Pythonie 3.11–3.13.',
              'Stan po rozszerzeniu regresji: co najmniej **255 testów jednostkowych PASS**, coverage `python_helper` powyżej wymaganych **90%**; pełny bezpłatny suite i 46 kontrolowanych przypadków LLM przechodzą na Pythonie 3.11–3.13. Dokładne wartości raportuje CI.',
          )
          replace_once(
              "README.md",
              'Rdzeń deterministyczny i protokół `active_rules` są po audycie. Pierwsza macierz 108 odpowiedzi została unieważniona: 36 odpowiedzi Claude zawierało Markdown fences akceptowane przez zbyt pobłażliwy parser, a następnie rozszerzono próbę do siedmiu rodzin. Stara macierz została usunięta po zmianie oracle, schematu i scenariuszy. Repo celowo zawiera pusty katalog kaset; przed review trzeba nagrać od zera macierz 322 odpowiedzi. PR pozostaje **draftem**.',
              'Rdzeń deterministyczny jest po audycie. Diagnostyczna macierz 317/322 ujawniła, że MiniMax w scenariuszu 51 przeniósł `REVIEW_09` do `stops`; ten sam błąd wcześniej wykonał GPT-5 Nano. Podatek i oracle były poprawne, lecz protokół wymagał zbędnej transformacji listy `{kind, code}`, a schema nie rozróżniała kanałów. Protokół zastąpiono autorytatywną kopertą `expected_decision`, schema ma osobne enumy STOP/REVIEW, a wszystkie stare kasety usunięto. Przed review trzeba nagrać od zera 322 odpowiedzi. PR pozostaje **draftem**.',
          )

          replace_once(
              "docs/testing.md",
              'Python oblicza liczby, klasyfikacje, W, TEST 1–9 i atomowe `decision_facts`. Runner usuwa wszystkie wartości `false` i tworzy listę `active_rules` zawierającą tylko rodzaj i kod prawdziwych reguł. Model otrzymuje wyłącznie tę listę i zwraca:',
              'Python oblicza liczby, klasyfikacje, W, TEST 1–9 i atomowe `decision_facts`, a następnie składa kompletną autorytatywną kopertę `expected_decision`. Model nie mapuje już `{kind, code}` do kanałów; otrzymuje gotowe, rozdzielone `status`, `stops` i `reviews` i ma je skopiować bez zmian:',
          )
          replace_once(
              "docs/testing.md",
              'Historyczne kasety pełnego raportu ujawniły wymyślone kursy NBP, automatyczne `JetBrains → IP`, niespójny NEXUS i TEST-y deklarowane przez model jako PASS. Pierwsza macierz małej koperty ujawniła inną wadę protokołu: część modeli reinterpretowała nazwy fałszywych faktów i dopisywała nieaktywne kody. `active_rules` usuwa tę dwuznaczność bez wyjątków scenariuszowych.',
              'Historyczne kasety pełnego raportu ujawniły wymyślone kursy NBP, automatyczne `JetBrains → IP`, niespójny NEXUS i TEST-y deklarowane przez model jako PASS. Późniejsza lista `active_rules` usunęła fałszywe fakty, ale nadal wymagała od modelu transformacji `{kind, code}` do dwóch tablic. MiniMax i wcześniej GPT-5 Nano przeniosły kod REVIEW do `stops`. Obecna koperta `expected_decision` usuwa tę zbędną decyzję, a schema rozróżnia dozwolone kody każdego kanału.',
          )
          replace_once(
              "docs/testing.md",
              '- coverage `python_helper` 94,74%;',
              '- coverage `python_helper` powyżej wymaganego progu 90% (dokładną wartość raportuje CI);',
          )
          replace_once(
              "docs/testing.md",
              '- prompt zawiera wyłącznie prawdziwe `active_rules`; nieaktywny fakt i kod nie mogą być widoczne;',
              '- prompt zawiera wyłącznie autorytatywną kopertę `expected_decision`; fakty i nazwy predykatów nie mogą być widoczne, a schema odrzuca kod REVIEW w `stops` i kod STOP w `reviews`;',
          )
          replace_once(
              "docs/testing.md",
              'Fingerprint obejmuje protokół decyzji, listę aktywnych reguł, system prompt, request, model, profil, schema i format kasety. Zmiana któregokolwiek elementu unieważnia nagranie. Kasety z pełną mapą `true/false` oraz pierwsza macierz `active_rules` z parserem usuwającym Markdown fences są nieaktualne i muszą zostać nagrane od nowa.',
              'Fingerprint obejmuje protokół decyzji, autorytatywną kopertę, system prompt, request, model, profil, schema i format kasety. Zmiana któregokolwiek elementu unieważnia nagranie. Kasety pełnego raportu, mapy `true/false`, listy `active_rules` oraz diagnostyczna macierz 317/322 są nieaktualne i muszą zostać nagrane od nowa.',
          )

          replace_once(
              "docs/independent-audit-brief.md",
              'Oczekiwany punkt startowy: 255 testów jednostkowych PASS, coverage co najmniej 94,74%, 46 kontrolowanych skipów LLM i pusty katalog kaset poza `.gitkeep`.',
              'Oczekiwany punkt startowy: co najmniej 255 testów jednostkowych PASS, coverage co najmniej 90%, 46 kontrolowanych skipów LLM i pusty katalog kaset poza `.gitkeep`.',
          )
          replace_once(
              "docs/independent-audit-brief.md",
              '13. `active_rules` zawiera tylko fakty prawdziwe, a nieaktywne nazwy i kody nie trafiają do promptu;',
              '13. prompt zawiera tylko `expected_decision`, bez faktów i nazw predykatów; STOP/REVIEW są rozdzielone w danych i schema;',
          )
          replace_once(
              "docs/independent-audit-brief.md",
              'Nagraj wszystkie 322 kasety od nowa. Poprzednia macierz 108 plików została usunięta: 36 odpowiedzi Claude zawierało Markdown fences akceptowane przez dawny parser, a lista modeli została rozszerzona do siedmiu rodzin.',
              'Nagraj wszystkie 322 kasety od nowa. Diagnostyczna macierz 317/322 została usunięta po zmianie protokołu: MiniMax w scenariuszu 51 przeniósł `REVIEW_09` do `stops`, ujawniając brak rozdzielenia kanałów w wejściu i schema. Nie kopiuj ani nie uzupełniaj tamtej macierzy.',
          )
          replace_once(
              "docs/independent-audit-brief.md",
              'Nieaktywne kody nie powinny być widoczne w promptach.',
              'Fakty i nazwy predykatów nie mogą być widoczne w promptach. W scenariuszu 51 oczekiwana koperta to dokładnie `STOPPED`, `stops=[STOP_12]`, `reviews=[REVIEW_09]`.',
          )

          replace_once(
              "docs/vcr-rebuild-brief.md",
              'Punkt docelowy: **46 scenariuszy × 7 modeli = 322 świeże kasety oraz 7 manifestów**.',
              'Punkt docelowy: **46 scenariuszy × 7 modeli = 322 świeże kasety oraz 7 manifestów**. Macierz 317/322 z HEAD `b9b6f04` jest wyłącznie materiałem diagnostycznym i została unieważniona po zmianie promptu, schematu i profilu MiniMax.',
          )
          replace_once(
              "docs/vcr-rebuild-brief.md",
              '- ręcznie przejrzeć scenariusze 46–55 i potwierdzić poprawne kanały STOP 09–16;',
              '- ręcznie przejrzeć scenariusze 46–55; dla scenariusza 51 potwierdzić dokładnie `stops=[STOP_12]` i `reviews=[REVIEW_09]`, bez przenoszenia kodów między kanałami;',
          )

          replace_once(
              "docs/real-world-regressions.md",
              'Scenariusze `46`–`55` są częścią pełnej macierzy modeli. Po zmianie scenariusza, oracle, schema lub algorytmu wszystkie kasety muszą zostać usunięte i nagrane od nowa. Nie wolno mieszać starych kaset z nowym kontraktem.',
              'Scenariusze `46`–`55` są częścią pełnej macierzy modeli. Scenariusz 51 ujawnił także wadę protokołu LLM: MiniMax, podobnie jak wcześniej GPT-5 Nano, przeniósł `REVIEW_09` do `stops`. Sześć innych rodzin zwróciło poprawne kanały, więc nie był to błąd podatkowy ani oracle. Słaby model ujawnił jednak zbędną transformację i zbyt szeroką schema; dlatego Python przekazuje teraz gotową kopertę `expected_decision`, a schema ma osobne enumy STOP/REVIEW. Po zmianie scenariusza, oracle, schema, promptu lub algorytmu wszystkie kasety muszą zostać usunięte i nagrane od nowa.',
          )

          replace_once(
              "CHANGELOG.md",
              '- Kontrakt `active_rules`, który nie pokazuje modelowi fałszywych przesłanek ani nieaktywnych kodów.',
              '- Autorytatywną kopertę `expected_decision`, która nie pokazuje modelowi faktów podatkowych ani nie wymaga klasyfikowania kodów do kanałów.',
          )
          replace_once(
              "CHANGELOG.md",
              '- Parser odrzuca Markdown fences zamiast naprawiać odpowiedź modelu.',
              '- Parser odrzuca Markdown fences zamiast naprawiać odpowiedź modelu.\n- Decision JSON Schema ma oddzielne enumy STOP i REVIEW oraz odrzuca kody w niewłaściwym kanale przed oceną semantyczną.\n- Profil MiniMax używa temperatury `0.0`; scenariusz 51 ma regresję dokładnej koperty `STOP_12` + `REVIEW_09`.',
          )

          cassette_root = Path("tests/llm/vcr/cassettes")
          cassette_root.mkdir(parents=True, exist_ok=True)
          for child in cassette_root.iterdir():
              if child.name == ".gitkeep":
                  continue
              if child.is_dir():
                  shutil.rmtree(child)
              else:
                  child.unlink()
          (cassette_root / ".gitkeep").touch()
          PY

      - name: Format and lint
        run: |
          ruff format .
          ruff check --fix .
          ruff format --check .
          ruff check .

      - name: Compile and test
        run: |
          python -m compileall -q python_helper tests scripts
          pytest tests/unit --cov=python_helper --cov-report=term-missing --cov-fail-under=90
          pytest -q
          python scripts/check_cassette_policy.py
          for script in scripts/*.sh dump-to-md.sh; do bash -n "$script"; done

      - name: Commit hardened protocol
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'fix: make LLM decision envelope channel-safe'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
