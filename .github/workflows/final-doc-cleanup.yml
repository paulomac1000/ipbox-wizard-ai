name: Final documentation cleanup
on:
  pull_request:
    branches:
      - main
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
          fetch-depth: 0
          persist-credentials: true
      - name: Normalize final release wording
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              '324/324': '252/252',
              '324 kaset': '252 kaset',
              '324 aktualne nagrania': '252 aktualne nagrania',
              'macierz 324': 'macierz 252',
              'Macierz 9 × 36': 'Macierz 7 × 36',
              'macierz 9 × 36': 'macierz 7 × 36',
              '9 modeli × 36 scenariuszy': '7 modeli × 36 scenariuszy',
              'dziewięciu modeli': 'siedmiu modeli',
              'dziewięć modeli': 'siedem modeli',
              'dziewięciu rodzin': 'siedmiu rodzin',
              'dziewięć rodzin': 'siedem rodzin',
              'dziewięciorodzinn': 'siedmiorodzinn',
              'nine-family': 'seven-family',
              'nine models': 'seven models',
          }
          for path in Path('.').rglob('*.md'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              for source, target in replacements.items():
                  text = text.replace(source, target)
              path.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              'Benchmark używa siedmiu tanich modeli z siedmiu niezależnych rodzin:',
              'Bramka wydania używa siedmiu kompletnych rodzin, które przeszły dokładnie ten sam ścisły kontrakt:',
          )
          text = text.replace(
              'PR pozostaje **draftem**, dopóki nie powstanie kompletna macierz 252 ścisłych odpowiedzi JSON.',
              'Repo zawiera kompletną macierz 252/252 ścisłych odpowiedzi JSON. PR pozostaje **draftem** do końcowego review.',
          )
          readme.write_text(text, encoding='utf-8')
          PY

          ! grep -RInE '324|dziewięciu modeli|dziewięć modeli|dziewięciu rodzin|dziewięć rodzin|Macierz 9 × 36|macierz 9 × 36' \
            --include='*.md' .
          rm -f .github/final-doc-cleanup-trigger.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Validate final documentation commit
        run: |
          set -euo pipefail
          ruff format --check .
          ruff check .
          python -m compileall -q python_helper tests scripts
          pytest tests/unit --cov=python_helper --cov-report=term-missing --cov-fail-under=90
          pytest -q
          python scripts/check_cassette_policy.py
          python scripts/vcr_precommit.py --all-models
          for script in scripts/*.sh dump-to-md.sh; do bash -n "$script"; done
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'docs: align release gate with seven recorded families'
          git push origin HEAD:fix/decouple-mix-allocation-from-w
