name: Apply audit fixes and refresh cassettes

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/decouple-mix-allocation-from-w

permissions:
  contents: write

concurrency:
  group: apply-audit-fixes-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  apply-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LLM_PROVIDER: openrouter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt
      - name: Finalize audited source
        run: |
          set -euo pipefail
          test -f python_helper/input_validation.py || {
            echo "::error::the main audited source commit is missing"
            exit 1
          }
          python - <<'PY'
          from pathlib import Path

          calculator = Path("python_helper/ipbox_calculator.py")
          text = calculator.read_text(encoding="utf-8")
          signal = "    if has_non_deductible_description_signal(description):\n"
          explicit = "    if item.basket:\n        return item\n"
          signal_index = text.index(signal)
          explicit_index = text.index(explicit)
          if explicit_index > signal_index:
              signal_block = text[signal_index:explicit_index]
              text = (
                  text[:signal_index]
                  + explicit
                  + signal_block
                  + text[explicit_index + len(explicit):]
              )
              calculator.write_text(text, encoding="utf-8")

          tests = Path("tests/unit/test_calculator_core.py")
          test_text = tests.read_text(encoding="utf-8")
          marker = "def test_description_signal_does_not_override_explicit_cost_classification"
          if marker not in test_text:
              test_text += '''\n\ndef test_description_signal_does_not_override_explicit_cost_classification() -> None:\n    explicit = CostItem(\n        "Kawa do domu — koszt zweryfikowany dokumentem",\n        100,\n        basket="IP",\n        allocation_source="verified-cost-ledger",\n    )\n\n    assert classify_cost(explicit, False, False) is explicit\n'''
              tests.write_text(test_text, encoding="utf-8")
          PY
      - name: Format and lint audited code
        run: |
          set -euo pipefail
          ruff format .
          ruff check --fix .
          ruff format --check .
          ruff check .
      - name: Deterministic gates
        run: |
          set -euo pipefail
          python -m compileall -q python_helper tests scripts
          pytest tests/unit --cov=python_helper --cov-report=term-missing --cov-fail-under=90
          pytest -q
          for script in scripts/*.sh dump-to-md.sh; do bash -n "$script"; done
      - name: Commit audited code
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .audit-patch .github/workflows/apply-audit-fixes-temp.yml || true
          if git diff --cached --quiet; then
            echo "Audited source is already committed"
          else
            git diff --cached --stat
            git commit -m "fix: preserve explicit cost classification"
            git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          fi
      - name: Detect recording capability
        id: recording
        if: github.event_name == 'push'
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENROUTER_API_KEY is unavailable; audited code is committed but cassette recording is deferred"
          fi
      - name: Record and verify full matrix
        if: github.event_name == 'push' && steps.recording.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          rm -rf tests/llm/vcr/cassettes
          mkdir -p tests/llm/vcr/cassettes
          ./scripts/record_all_models.sh --max-cost-usd 1
          unset OPENROUTER_API_KEY
          ./scripts/verify_all_models.sh
          python scripts/vcr_precommit.py --all-models
          python scripts/check_cassette_policy.py
          python scripts/benchmark_report.py
      - name: Commit cassettes and remove temporary files
        if: github.event_name == 'push' && steps.recording.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch .audit-patch
          git rm --ignore-unmatch \
            .github/workflows/apply-audit-fixes-temp.yml \
            .github/workflows/source-snapshot-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "test: refresh audited LLM cassette matrix"
          git push origin "HEAD:${GITHUB_REF_NAME}"
