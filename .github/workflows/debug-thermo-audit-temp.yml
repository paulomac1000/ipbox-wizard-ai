name: Debug and publish thermomodernization audit fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: debug-thermo-audit-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: pip install -q -r requirements.txt -r requirements-test.txt

      - name: Reuse audited patch definition
        run: |
          python - <<'PYRUN'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path(".github/workflows/apply-thermo-audit-temp.yml").read_text(
              encoding="utf-8"
          )
          match = re.search(
              r"      - name: Apply audited patch\n"
              r"        run: \|\n"
              r"          python - <<'PY'\n"
              r"(.*?)\n"
              r"          PY\n",
              workflow,
              re.DOTALL,
          )
          if match is None:
              raise SystemExit("Cannot extract audited patch definition")
          script = textwrap.dedent(match.group(1))
          exec(compile(script, "<audited-patch>", "exec"), {})

          target = Path("tests/unit/test_final_audit_regressions.py")
          text = target.read_text(encoding="utf-8")
          broken_meta = 'path.write_text("meta: {}' + "\n" + '", encoding="utf-8")'
          fixed_meta = 'path.write_text("meta: {}\\n", encoding="utf-8")'
          broken_cassette = (
              '"meta:'
              + "\n"
              + "  cost: 0.20"
              + "\n"
              + "response: ok"
              + "\n"
              + "parsed_response: {}"
              + "\n"
              + '"'
          )
          fixed_cassette = '"meta:\\n  cost: 0.20\\nresponse: ok\\nparsed_response: {}\\n"'
          if broken_meta not in text or broken_cassette not in text:
              raise SystemExit("Expected generated newline-literal defects were not found")
          target.write_text(
              text.replace(broken_meta, fixed_meta).replace(
                  broken_cassette,
                  fixed_cassette,
              ),
              encoding="utf-8",
          )

          scenario48 = Path("tests/llm/scenarios/48_historical_2024_pit_like_cascade.yaml")
          text = scenario48.read_text(encoding="utf-8")
          old = "  ulgi:\n    ikze: 14000\n    termomodernizacja_pula: 10000\n"
          new = (
              "  ulgi:\n"
              "    ikze: 14000\n"
              "    termomodernizacja_loty:\n"
              "      - origin_year: 2024\n"
              "        remaining_amount: 10000\n"
              "        evidence_ref: synthetic-thermo-48-2024\n"
          )
          if old not in text:
              raise SystemExit("Scenario 48 aggregate pool block not found")
          scenario48.write_text(text.replace(old, new, 1), encoding="utf-8")

          stopped_test = Path("tests/unit/test_scenarios_and_evaluator.py")
          text = stopped_test.read_text(encoding="utf-8")
          old = '    assert all(value == 0 for value in result["podatek"].values())\n'
          new = '''    financial_tax_fields = (
              "podstawa_IP",
              "podstawa_NIE",
              "podstawa_zwykła",
              "dochód_IP_po_uldze_BR",
              "dochód_IP_kwalifikowany",
              "dochód_IP_poza_preferencją",
              "podatek_IP",
              "podatek_NIE_finalny",
              "podatek_całościowy",
              "nadpłata_lub_dopłata",
              "thermomodernization_used",
              "termomodernization_carry_over",
              "termomodernization_expired",
              "health_tax_credit_used",
              "ulga_BR_IP_wykorzystana",
              "ulga_BR_NIE_wykorzystana",
              "ulga_BR_carry_over",
              "dochód_dodatkowy_skala",
          )
          assert all(result["podatek"][field] == 0 for field in financial_tax_fields)
          assert result["podatek"]["thermomodernization_mode"] == "none"
          assert (
              result["podatek"]["thermomodernization_evidence_status"]
              == "NOT_APPLICABLE"
          )
          '''
          if old not in text:
              raise SystemExit("STOP financial assertion not found")
          stopped_test.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow_test = Path("tests/unit/test_vcr_and_client.py")
          text = workflow_test.read_text(encoding="utf-8")
          old = '    assert "MAX_COST_USD: ${{ inputs.max-cost-usd }}" in paid\n'
          new = '''    assert (
              "MAX_COST_PER_MODEL_USD: ${{ inputs.max-cost-per-model-usd }}" in paid
          )
          assert "MAX_TOTAL_COST_USD: ${{ inputs.max-total-cost-usd }}" in paid
          assert "inputs.confirmation == 'RUN_PAID_BENCHMARK'" in paid
          '''
          if old not in text:
              raise SystemExit("Old paid workflow budget assertion not found")
          workflow_test.write_text(text.replace(old, new, 1), encoding="utf-8")
          PYRUN

      - name: Format, lint, and compile
        run: |
          set -euo pipefail
          ruff format .
          ruff check --fix .
          ruff format --check .
          ruff check .
          python -m compileall -q python_helper tests scripts

      - name: Capture unit-test diagnostics
        run: |
          set +e
          mkdir -p reports
          pytest tests/unit \
            --cov=python_helper \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            > reports/unit-tests.txt 2>&1
          printf '%s\n' "$?" > reports/unit-tests-status.txt
          exit 0

      - name: Upload unit-test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: thermo-unit-${{ github.sha }}
          path: reports/
          if-no-files-found: error
          retention-days: 1

      - name: Enforce unit tests
        run: |
          set -euo pipefail
          cat reports/unit-tests.txt
          test "$(cat reports/unit-tests-status.txt)" -eq 0
          rm -rf reports

      - name: Full free suite
        run: pytest -q

      - name: Shell syntax and diff checks
        run: |
          set -euo pipefail
          for script in scripts/*.sh dump-to-md.sh; do bash -n "$script"; done
          git diff --check

      - name: Publish verified code patch
        run: |
          set -euo pipefail
          git add \
            python_helper/tax_year_rules.py \
            python_helper/tax_cascade.py \
            tests/llm/oracle.py \
            tests/llm/oracle_guards.py \
            tests/llm/output_schema.py \
            tests/llm/scenarios/27_termomodernizacja_full.yaml \
            tests/llm/scenarios/28_edge_multiple_carry-overs.yaml \
            tests/llm/scenarios/48_historical_2024_pit_like_cascade.yaml \
            tests/unit/test_tax_year_rules.py \
            tests/unit/test_final_audit_regressions.py \
            tests/unit/test_scenarios_and_evaluator.py \
            tests/unit/test_vcr_and_client.py \
            docs/historical-tax-rules.md
          if git diff --cached --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: make relief evidence and recording budgets auditable"
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
