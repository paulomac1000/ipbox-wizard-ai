name: Apply review follow-up

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-pr8-review-followup
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/consolidate-pr-review-fixes
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Apply reviewed fixes
        run: |
          set -euo pipefail
          patch -p1 < .github/review-followup.patch
          rm .github/review-followup.patch
          rm .github/workflows/apply-review-followup.yml

      - name: Format and lint
        run: |
          set -euo pipefail
          ruff format .
          ruff check . --fix
          ruff format --check .
          ruff check .

      - name: Deterministic tests
        run: |
          set -euo pipefail
          python -m compileall -q python_helper tests scripts
          pytest tests/unit \
            --cov=python_helper \
            --cov-report=term-missing \
            --cov-fail-under=90
          pytest -q
          for script in scripts/*.sh; do bash -n "$script"; done

      - name: Refresh and verify cassette metadata
        run: |
          set -euo pipefail
          python scripts/refresh_vcr_metadata.py --all-models --write
          python scripts/check_cassette_policy.py
          ./scripts/verify_all_models.sh

      - name: Commit review follow-up
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: address final bot review findings'
          git push origin HEAD:agent/consolidate-pr-review-fixes
