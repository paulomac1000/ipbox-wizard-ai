name: Apply consolidated fixes

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-consolidated-fixes
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consolidate-pr-review-fixes
          fetch-depth: 0
          persist-credentials: true

      - name: Detect pending patch
        id: patch
        run: |
          if [[ -f .github/consolidated.patch.part00 ]]; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.patch.outputs.apply == 'true'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        if: steps.patch.outputs.apply == 'true'
        run: python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Apply locally validated patch
        if: steps.patch.outputs.apply == 'true'
        run: |
          set -euo pipefail
          cat .github/consolidated.patch.part* | base64 --decode | gzip -d > "$RUNNER_TEMP/consolidated.patch"
          patch -p1 < "$RUNNER_TEMP/consolidated.patch"
          rm -f .github/consolidated.patch.part* .github/consolidated.patch.gz.b64

      - name: Format and lint
        if: steps.patch.outputs.apply == 'true'
        run: |
          set -euo pipefail
          ruff format .
          ruff check . --fix
          ruff format --check .
          ruff check .

      - name: Deterministic test gate
        if: steps.patch.outputs.apply == 'true'
        run: |
          set -euo pipefail
          python -m compileall -q python_helper tests scripts
          pytest tests/unit \
            --cov=python_helper \
            --cov-report=term-missing \
            --cov-fail-under=90
          pytest -q
          for script in scripts/*.sh; do bash -n "$script"; done

      - name: Refresh and verify cassette metadata
        if: steps.patch.outputs.apply == 'true'
        run: |
          set -euo pipefail
          python scripts/refresh_vcr_metadata.py --all-models --write
          python scripts/check_cassette_policy.py
          ./scripts/verify_all_models.sh

      - name: Commit consolidated result
        if: steps.patch.outputs.apply == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: consolidate review and tax correctness follow-ups'
          git push origin HEAD:agent/consolidate-pr-review-fixes
