name: Diagnose reviewed unit tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'fix/decouple-mix-allocation-from-w'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
          fetch-depth: 1
          show-progress: false

      - name: Reconstruct and repair reviewed tree
        run: |
          set -euo pipefail
          cat .delivery/part-* > /tmp/payload.b64
          python3 - <<'PY'
          import base64
          import tarfile
          from pathlib import Path
          archive = Path('/tmp/reviewed.tar.gz')
          archive.write_bytes(base64.b64decode(Path('/tmp/payload.b64').read_bytes(), validate=True))
          root = Path('/tmp/reviewed-tree')
          root.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive, 'r:gz') as tf:
              tf.extractall(root)
          PY
          cat .delivery/remote-oracle-part-00 .delivery/remote-oracle-part-01 \
              .delivery/remote-oracle-part-02 .delivery/remote-oracle-part-03 \
              .delivery/oracle-fix-part-04 .delivery/oracle-fix-part-05 \
            | base64 --decode > /tmp/reviewed-tree/tests/llm/oracle.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: /tmp/reviewed-tree
        run: pip install -q -r requirements.txt -r requirements-test.txt

      - name: Run unit tests
        id: unit
        continue-on-error: true
        working-directory: /tmp/reviewed-tree
        run: |
          mkdir -p reports
          ruff format . > reports/format.log 2>&1
          pytest tests/unit --cov=python_helper --cov-report=term-missing --cov-fail-under=90 -vv > reports/unit.log 2>&1

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostic
          path: /tmp/reviewed-tree/reports/
          if-no-files-found: error

      - name: Fail after upload
        if: steps.unit.outcome != 'success'
        run: exit 1
