name: "Full Test Suite"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  unit:
    uses: ./.github/workflows/unit-tests.yml

  llm:
    needs: unit
    uses: ./.github/workflows/llm-scenario-tests.yml
    secrets: inherit
    if: github.event_name == 'push'

  summary:
    needs: [unit, llm]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report status
        run: |
          echo "Unit tests:    ${{ needs.unit.result }}"
          echo "LLM tests:     ${{ needs.llm.result }}"
          if [ "${{ needs.unit.result }}" != "success" ]; then
            echo "::error::Testy jednostkowe nie przeszły!"
            exit 1
          fi
          if [ "${{ needs.llm.result }}" == "failure" ]; then
            echo "::warning::Testy LLM nie przeszły — sprawdź artefakty."
          fi
          echo "Pipeline zakończony."
