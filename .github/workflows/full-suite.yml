name: Diagnose reviewed unit tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'fix/decouple-mix-allocation-from-w' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
          fetch-depth: 1
          show-progress: false

      - name: Reconstruct and repair reviewed tree
        run: |
          set -euo pipefail
          cat .delivery/part-* > /tmp/payload.b64
          python3 - <<'PY'
          import base64
          import tarfile
          from pathlib import Path

          archive = Path('/tmp/reviewed.tar.gz')
          archive.write_bytes(base64.b64decode(Path('/tmp/payload.b64').read_bytes(), validate=True))
          root = Path('/tmp/reviewed-tree').resolve()
          root.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive, 'r:gz') as tf:
              tf.extractall(root)
          PY
          cat .delivery/remote-oracle-part-00 .delivery/remote-oracle-part-01 \
              .delivery/remote-oracle-part-02 .delivery/remote-oracle-part-03 \
              .delivery/oracle-fix-part-04 .delivery/oracle-fix-part-05 \
            | base64 --decode > /tmp/reviewed-tree/tests/llm/oracle.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: /tmp/reviewed-tree
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Run and capture unit tests
        run: |
          set +e
          cd /tmp/reviewed-tree
          ruff format . >/tmp/format.log 2>&1
          pytest tests/unit --cov=python_helper --cov-report=term-missing --cov-fail-under=90 -vv > /tmp/unit.log 2>&1
          code=$?
          set -e
          tail -n 180 /tmp/unit.log | sed -E 's/(OPENROUTER_API_KEY|Authorization):?[^ ]*/\1=[REDACTED]/g' > "$GITHUB_WORKSPACE/.delivery/unit-test-diagnostic.txt"
          cat "$GITHUB_WORKSPACE/.delivery/unit-test-diagnostic.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .delivery/unit-test-diagnostic.txt
          git commit -m "chore: capture unit test diagnostic"
          git push origin HEAD:fix/decouple-mix-allocation-from-w
          exit "$code"
