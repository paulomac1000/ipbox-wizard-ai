name: Diagnose reviewed production tree

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'fix/decouple-mix-allocation-from-w' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
          fetch-depth: 1
          show-progress: false

      - name: Diagnose oracle transport bytes
        run: |
          set -euo pipefail
          cat .delivery/part-* > /tmp/payload.b64
          python3 - <<'PY'
          import base64
          import hashlib
          import tarfile
          from pathlib import Path

          archive = Path('/tmp/reviewed.tar.gz')
          archive.write_bytes(base64.b64decode(Path('/tmp/payload.b64').read_bytes(), validate=True))
          root = Path('/tmp/reviewed-tree')
          root.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive, 'r:gz') as tf:
              tf.extractall(root)

          path = root / 'tests/llm/oracle.py'
          data = path.read_bytes()
          lines = [
              f'size={len(data)}',
              f'sha256={hashlib.sha256(data).hexdigest()}',
          ]
          try:
              data.decode('utf-8')
              lines.append('utf8=valid')
          except UnicodeDecodeError as exc:
              start = max(0, exc.start - 32)
              end = min(len(data), exc.end + 32)
              lines.extend([
                  'utf8=invalid',
                  f'error_start={exc.start}',
                  f'error_end={exc.end}',
                  f'error_reason={exc.reason}',
                  f'context_start={start}',
                  f'context_end={end}',
                  f'context_hex={data[start:end].hex()}',
              ])
          output = '\n'.join(lines) + '\n'
          print(output)
          Path('.delivery/oracle-byte-diagnostic.txt').write_text(output, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .delivery/oracle-byte-diagnostic.txt
          git commit -m "chore: capture oracle byte diagnostic"
          git push origin HEAD:fix/decouple-mix-allocation-from-w
