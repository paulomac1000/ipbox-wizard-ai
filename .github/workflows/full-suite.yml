name: Publish reviewed production tree

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'fix/decouple-mix-allocation-from-w' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
          fetch-depth: 1
          show-progress: false

      - name: Reconstruct reviewed source
        run: |
          set -euo pipefail
          cat \
            .delivery/part-00 .delivery/part-01 .delivery/part-02 .delivery/part-03 \
            .delivery/part-04 .delivery/part-05 .delivery/part-06 .delivery/part-07 \
            .delivery/fix08-* .delivery/fix09-* .delivery/fix10-* \
            .delivery/part-11 .delivery/part-12 \
            > /tmp/payload.b64
          base64 --decode /tmp/payload.b64 > /tmp/ipbox-final-reviewed.tar.gz
          echo "31c0c351533d285bebca186ae8ed9f5fac0740d72b9166ba3c5a00f84afc1193  /tmp/ipbox-final-reviewed.tar.gz" | sha256sum -c -
          rm -rf /tmp/reviewed-tree
          mkdir -p /tmp/reviewed-tree
          python3 - <<'PY'
          import tarfile
          from pathlib import Path

          root = Path('/tmp/reviewed-tree').resolve()
          with tarfile.open('/tmp/ipbox-final-reviewed.tar.gz', 'r:gz') as tf:
              for member in tf.getmembers():
                  target = (root / member.name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f'unsafe archive path: {member.name}')
              tf.extractall(root)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            /tmp/reviewed-tree/requirements.txt
            /tmp/reviewed-tree/requirements-test.txt

      - name: Install dependencies
        working-directory: /tmp/reviewed-tree
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Ruff format
        working-directory: /tmp/reviewed-tree
        run: ruff format --check .

      - name: Ruff lint
        working-directory: /tmp/reviewed-tree
        run: ruff check .

      - name: Compile Python
        working-directory: /tmp/reviewed-tree
        run: python -m compileall -q python_helper tests scripts

      - name: Unit tests and coverage
        working-directory: /tmp/reviewed-tree
        run: |
          pytest tests/unit \
            --cov=python_helper \
            --cov-report=term-missing \
            --cov-fail-under=90

      - name: Full free suite
        working-directory: /tmp/reviewed-tree
        run: pytest -q

      - name: Cassette policy
        working-directory: /tmp/reviewed-tree
        run: python scripts/check_cassette_policy.py

      - name: Shell syntax
        working-directory: /tmp/reviewed-tree
        run: |
          set -euo pipefail
          for script in scripts/*.sh dump-to-md.sh; do
            bash -n "$script"
          done

      - name: Replace branch while preserving current workflows
        run: |
          set -euo pipefail
          rm -rf /tmp/current-workflows
          mkdir -p /tmp/current-workflows
          cp -a .github/workflows/. /tmp/current-workflows/
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/reviewed-tree/. .
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -a /tmp/current-workflows/. .github/workflows/

      - name: Commit production code
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make IP Box benchmark deterministic and multi-model"
          git push origin HEAD:fix/decouple-mix-allocation-from-w
