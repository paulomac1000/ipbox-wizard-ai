name: Apply reviewed production tree

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/decouple-mix-allocation-from-w' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
          fetch-depth: 1
          show-progress: false

      - name: Reconstruct reviewed source
        run: |
          set -euo pipefail
          wc -c .delivery/part-*
          cat .delivery/part-* > /tmp/payload.b64
          python3 - <<'PY'
          import base64
          import hashlib
          import tarfile
          from pathlib import Path

          payload = Path('/tmp/payload.b64').read_bytes()
          print(f'payload_bytes={len(payload)}')
          try:
              archive_bytes = base64.b64decode(payload, validate=True)
          except Exception as exc:
              print(f'base64_error={exc!r}')
              raise
          actual = hashlib.sha256(archive_bytes).hexdigest()
          print(f'archive_bytes={len(archive_bytes)}')
          print(f'archive_sha256={actual}')
          Path('/tmp/ipbox-final-reviewed.tar.gz').write_bytes(archive_bytes)
          with tarfile.open('/tmp/ipbox-final-reviewed.tar.gz', 'r:gz') as tf:
              names = tf.getnames()
              print(f'archive_members={len(names)}')
          PY
          rm -rf /tmp/reviewed-tree
          mkdir -p /tmp/reviewed-tree
          python3 - <<'PY'
          import tarfile
          from pathlib import Path

          root = Path('/tmp/reviewed-tree').resolve()
          with tarfile.open('/tmp/ipbox-final-reviewed.tar.gz', 'r:gz') as tf:
              for member in tf.getmembers():
                  target = (root / member.name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f'unsafe archive path: {member.name}')
              tf.extractall(root)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: /tmp/reviewed-tree
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Validate reviewed tree
        working-directory: /tmp/reviewed-tree
        run: |
          set -euo pipefail
          ruff format --check .
          ruff check .
          python -m compileall -q python_helper tests scripts
          pytest tests/unit --cov=python_helper --cov-report=term-missing --cov-fail-under=90
          pytest -q
          python scripts/check_cassette_policy.py
          for script in scripts/*.sh dump-to-md.sh; do
            bash -n "$script"
          done

      - name: Replace branch with reviewed tree
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/reviewed-tree/. .

      - name: Commit production tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make IP Box benchmark deterministic and multi-model"
          git push origin HEAD:fix/decouple-mix-allocation-from-w
