name: Publish reviewed production tree

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'fix/decouple-mix-allocation-from-w' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
          fetch-depth: 1
          show-progress: false

      - name: Reconstruct and repair reviewed tree
        run: |
          set -euo pipefail
          cat .delivery/part-* > /tmp/payload.b64
          python3 - <<'PY'
          import base64
          import tarfile
          from pathlib import Path

          archive = Path('/tmp/reviewed.tar.gz')
          archive.write_bytes(base64.b64decode(Path('/tmp/payload.b64').read_bytes(), validate=True))
          root = Path('/tmp/reviewed-tree').resolve()
          root.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive, 'r:gz') as tf:
              for member in tf.getmembers():
                  target = (root / member.name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f'unsafe archive path: {member.name}')
              tf.extractall(root)
          PY
          cat .delivery/remote-oracle-part-00 .delivery/remote-oracle-part-01 \
              .delivery/remote-oracle-part-02 .delivery/remote-oracle-part-03 \
              .delivery/oracle-fix-part-04 .delivery/oracle-fix-part-05 \
            | base64 --decode > /tmp/reviewed-tree/tests/llm/oracle.py
          echo "d4c2634c324eafeaf7be7a7b7c935ac7812e04d55ab87c33761f94ac4e445c3b  /tmp/reviewed-tree/tests/llm/oracle.py" | sha256sum -c -

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: /tmp/reviewed-tree
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Format
        working-directory: /tmp/reviewed-tree
        run: |
          ruff format .
          ruff format --check .

      - name: Lint
        working-directory: /tmp/reviewed-tree
        run: ruff check .

      - name: Compile
        working-directory: /tmp/reviewed-tree
        run: python -m compileall -q python_helper tests scripts

      - name: Unit tests and coverage
        working-directory: /tmp/reviewed-tree
        run: pytest tests/unit --cov=python_helper --cov-report=term-missing --cov-fail-under=90

      - name: Full free suite
        working-directory: /tmp/reviewed-tree
        run: pytest -q

      - name: Cassette policy
        working-directory: /tmp/reviewed-tree
        run: python scripts/check_cassette_policy.py

      - name: Shell syntax
        working-directory: /tmp/reviewed-tree
        run: |
          set -euo pipefail
          for script in scripts/*.sh dump-to-md.sh; do
            bash -n "$script"
          done

      - name: Replace branch with reviewed tree
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/reviewed-tree/. .

      - name: Commit production tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make IP Box benchmark deterministic and multi-model"
          git push origin HEAD:fix/decouple-mix-allocation-from-w
