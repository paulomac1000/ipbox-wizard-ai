name: Apply reviewed production tree

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/decouple-mix-allocation-from-w' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
          fetch-depth: 1
          show-progress: false

      - name: Reconstruct reviewed source
        run: |
          set -euo pipefail
          cat .delivery/part-* > /tmp/payload.b64
          python3 - <<'PY'
          import base64
          import tarfile
          from pathlib import Path

          payload = Path('/tmp/payload.b64').read_bytes()
          archive_bytes = base64.b64decode(payload, validate=True)
          Path('/tmp/ipbox-final-reviewed.tar.gz').write_bytes(archive_bytes)
          root = Path('/tmp/reviewed-tree').resolve()
          root.mkdir(parents=True, exist_ok=True)
          with tarfile.open('/tmp/ipbox-final-reviewed.tar.gz', 'r:gz') as tf:
              for member in tf.getmembers():
                  target = (root / member.name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f'unsafe archive path: {member.name}')
              tf.extractall(root)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: /tmp/reviewed-tree
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Format python_helper
        working-directory: /tmp/reviewed-tree
        run: ruff format python_helper

      - name: Format scripts
        working-directory: /tmp/reviewed-tree
        run: ruff format scripts

      - name: Format test roots
        working-directory: /tmp/reviewed-tree
        run: ruff format tests/__init__.py tests/conftest.py

      - name: Format LLM root files
        working-directory: /tmp/reviewed-tree
        run: ruff format tests/llm/*.py

      - name: Format VCR files
        working-directory: /tmp/reviewed-tree
        run: ruff format tests/llm/vcr

      - name: Format unit tests
        working-directory: /tmp/reviewed-tree
        run: ruff format tests/unit

      - name: Check Python format
        working-directory: /tmp/reviewed-tree
        run: ruff format --check python_helper scripts tests

      - name: Ruff lint
        working-directory: /tmp/reviewed-tree
        run: ruff check python_helper scripts tests

      - name: Compile
        working-directory: /tmp/reviewed-tree
        run: python -m compileall -q python_helper tests scripts

      - name: Unit tests and coverage
        working-directory: /tmp/reviewed-tree
        run: pytest tests/unit --cov=python_helper --cov-report=term-missing --cov-fail-under=90

      - name: Full free suite
        working-directory: /tmp/reviewed-tree
        run: pytest -q

      - name: Cassette policy
        working-directory: /tmp/reviewed-tree
        run: python scripts/check_cassette_policy.py

      - name: Shell syntax
        working-directory: /tmp/reviewed-tree
        run: |
          set -euo pipefail
          for script in scripts/*.sh dump-to-md.sh; do
            bash -n "$script"
          done

      - name: Replace branch with reviewed tree
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/reviewed-tree/. .

      - name: Commit production tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make IP Box benchmark deterministic and multi-model"
          git push origin HEAD:fix/decouple-mix-allocation-from-w
