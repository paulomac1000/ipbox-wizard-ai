name: "Full Test Suite"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  apply-reviewed-tree:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/decouple-mix-allocation-from-w' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
          fetch-depth: 0

      - name: Reconstruct reviewed source
        run: |
          set -euo pipefail
          cat .delivery/part-* | base64 --decode > /tmp/ipbox-final-reviewed.tar.gz
          echo "31c0c351533d285bebca186ae8ed9f5fac0740d72b9166ba3c5a00f84afc1193  /tmp/ipbox-final-reviewed.tar.gz" | sha256sum -c -
          rm -rf /tmp/reviewed-tree
          mkdir -p /tmp/reviewed-tree
          python3 - <<'PY'
          import tarfile
          from pathlib import Path

          archive = Path("/tmp/ipbox-final-reviewed.tar.gz")
          root = Path("/tmp/reviewed-tree").resolve()
          with tarfile.open(archive, "r:gz") as tf:
              for member in tf.getmembers():
                  target = (root / member.name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"unsafe archive path: {member.name}")
              tf.extractall(root)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: /tmp/reviewed-tree
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Validate reviewed tree
        working-directory: /tmp/reviewed-tree
        run: |
          set -euo pipefail
          ruff format --check .
          ruff check .
          python -m compileall -q python_helper tests scripts
          pytest tests/unit --cov=python_helper --cov-report=term-missing --cov-fail-under=90
          pytest -q
          python scripts/check_cassette_policy.py
          for script in scripts/*.sh dump-to-md.sh; do
            bash -n "$script"
          done

      - name: Replace branch with reviewed tree
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/reviewed-tree/. .

      - name: Commit production tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make IP Box benchmark deterministic and multi-model"
          git push origin HEAD:fix/decouple-mix-allocation-from-w

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Run ruff check
        run: ruff check .

  unit:
    uses: ./.github/workflows/unit-tests.yml

  llm:
    needs: unit
    uses: ./.github/workflows/llm-scenario-tests.yml
    secrets: inherit
    if: github.event_name == 'push' || github.event_name == 'pull_request'

  summary:
    needs: [lint, unit, llm]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        if: always()
        run: |
          echo "Lint check:    ${{ needs.lint.result }}"
          echo "Unit tests:    ${{ needs.unit.result }}"
          echo "LLM tests:     ${{ needs.llm.result }}"
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::Linting nie przeszło!"
            exit 1
          fi
          if [ "${{ needs.unit.result }}" != "success" ]; then
            echo "::error::Testy jednostkowe nie przeszły!"
            exit 1
          fi
          LLM_RESULT="${{ needs.llm.result }}"
          if [ "$LLM_RESULT" == "success" ]; then
            echo "LLM tests passed."
          elif [ "$LLM_RESULT" == "skipped" ] && [ "${{ github.event_name }}" == "schedule" ]; then
            echo "LLM tests skipped (schedule — OK)."
          elif [ "$LLM_RESULT" == "cancelled" ]; then
            echo "::error::LLM tests were cancelled — possible setup failure."
            exit 1
          else
            echo "::error::LLM tests: $LLM_RESULT"
            exit 1
          fi
          echo "Pipeline zakończony."
