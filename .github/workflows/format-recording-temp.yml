name: Format and verify recording guard

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: format-recording-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  format-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install dependencies
        run: pip install -q -r requirements.txt -r requirements-test.txt
      - name: Format and lint
        run: |
          set -euo pipefail
          ruff format scripts/record_model.py
          ruff format --check .
          ruff check .
          python -m compileall -q python_helper tests scripts
      - name: Unit tests with coverage
        run: pytest tests/unit --cov=python_helper --cov-report=term-missing --cov-fail-under=90
      - name: Full free suite and shell syntax
        run: |
          set -euo pipefail
          pytest -q
          for script in scripts/*.sh dump-to-md.sh; do bash -n "$script"; done
          git diff --check
      - name: Publish formatting
        run: |
          set -euo pipefail
          git add scripts/record_model.py
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format recording budget guard"
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
