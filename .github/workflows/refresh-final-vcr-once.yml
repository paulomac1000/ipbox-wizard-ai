name: Refresh final VCR metadata once

on:
  push:
    branches:
      - fix/decouple-mix-allocation-from-w

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - run: pip install -r requirements.txt -r requirements-test.txt
      - name: Refresh without provider access
        env:
          OPENROUTER_API_KEY: ""
        run: |
          set -euo pipefail
          unset OPENROUTER_API_KEY
          python scripts/refresh_vcr_metadata.py --all-models --write
          python scripts/vcr_precommit.py --all-models
          python scripts/check_cassette_policy.py
          ./scripts/verify_all_models.sh
          python scripts/benchmark_report.py
      - name: Commit refreshed metadata
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/llm/vcr/cassettes; then
            echo "No VCR metadata changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/llm/vcr/cassettes
          git commit -m "test: refresh VCR metadata after final safety fixes"
          git push origin HEAD:fix/decouple-mix-allocation-from-w
