name: Apply final VCR audit fixes

on:
  push:
    branches:
      - fix/decouple-mix-allocation-from-w

permissions:
  contents: write

concurrency:
  group: apply-final-vcr-audit-fixes
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Apply source fixes
        run: python scripts/apply_final_vcr_audit_fixes.py

      - name: Format sources
        run: ruff format .

      - name: Refresh cassette metadata without API calls
        env:
          OPENROUTER_API_KEY: ""
        run: |
          unset OPENROUTER_API_KEY || true
          python scripts/refresh_vcr_metadata.py --all-models --write

      - name: Verify deterministic and VCR gates
        run: |
          set -euo pipefail
          unset OPENROUTER_API_KEY || true
          ruff format --check .
          ruff check .
          python -m compileall -q python_helper tests scripts
          pytest tests/unit --cov=python_helper --cov-report=term-missing --cov-fail-under=90
          pytest -q
          for script in scripts/*.sh dump-to-md.sh; do bash -n "$script"; done
          python scripts/vcr_precommit.py --all-models
          python scripts/check_cassette_policy.py
          python scripts/benchmark_report.py
          ./scripts/verify_all_models.sh

      - name: Publish verified fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "fix: make VCR metadata content-addressed and reproducible"
          git push origin HEAD:fix/decouple-mix-allocation-from-w
