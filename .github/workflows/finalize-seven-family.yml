name: Finalize seven-family gate
on:
  pull_request:
    branches:
      - main
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decouple-mix-allocation-from-w
          fetch-depth: 0
          persist-credentials: true
      - name: Align historical tests and documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/unit/test_vcr_and_client.py')
          text = test_path.read_text(encoding='utf-8')
          old = '''def test_model_profiles_cover_nine_distinct_families() -> None:
              assert BENCHMARK_MODELS == (
                  "google/gemini-3-flash-preview",
                  "openai/gpt-5-nano",
                  "anthropic/claude-haiku-4.5",
                  "deepseek/deepseek-chat-v3.1",
                  "minimax/minimax-m2.5",
                  "moonshotai/kimi-k2.5",
                  "z-ai/glm-4.7-flash",
                  "qwen/qwen3.5-flash-02-23",
                  "mistralai/ministral-3b-2512",
              )
              assert len({get_model_profile(model).family for model in BENCHMARK_MODELS}) == 9
              assert get_model_profile("openai/gpt-5-nano").reasoning == {"effort": "minimal"}
              assert all(
                  get_model_profile(model).response_format_type == "json_schema" for model in BENCHMARK_MODELS
              )
              with pytest.raises(ValueError):
                  get_model_profile("bad")
          '''
          old = '\n'.join(line[12:] if line.startswith('            ') else line for line in old.splitlines()) + '\n'
          new = '''def test_model_profiles_cover_seven_distinct_families() -> None:
              assert BENCHMARK_MODELS == (
                  "google/gemini-3-flash-preview",
                  "anthropic/claude-haiku-4.5",
                  "deepseek/deepseek-chat-v3.1",
                  "minimax/minimax-m2.5",
                  "moonshotai/kimi-k2.5",
                  "qwen/qwen3.5-flash-02-23",
                  "mistralai/ministral-3b-2512",
              )
              assert len({get_model_profile(model).family for model in BENCHMARK_MODELS}) == 7
              assert all(
                  get_model_profile(model).response_format_type == "json_schema" for model in BENCHMARK_MODELS
              )
              with pytest.raises(ValueError):
                  get_model_profile("openai/gpt-5-nano")
              with pytest.raises(ValueError):
                  get_model_profile("z-ai/glm-4.7-flash")
              with pytest.raises(ValueError):
                  get_model_profile("bad")
          '''
          new = '\n'.join(line[12:] if line.startswith('            ') else line for line in new.splitlines()) + '\n'
          if old not in text:
              raise SystemExit('expected nine-family test block not found')
          test_path.write_text(text.replace(old, new), encoding='utf-8')

          doc_paths = [
              Path('README.md'),
              Path('AGENTS.md'),
              Path('.agents/onboarding.md'),
              Path('CHANGELOG.md'),
              Path('docs/testing.md'),
              Path('docs/model-diversity-benchmark.md'),
              Path('docs/audit-2026-07-17.md'),
              Path('docs/independent-audit-brief.md'),
          ]
          replacements = {
              '324/324': '252/252',
              '324 kaset': '252 kaset',
              '9 modeli × 36 scenariuszy': '7 modeli × 36 scenariuszy',
              '9 modeli': '7 modeli',
              'dziewięciu modeli': 'siedmiu modeli',
              'dziewięć modeli': 'siedem modeli',
              'dziewięciu rodzin': 'siedmiu rodzin',
              'dziewięciorodzinn': 'siedmiorodzinn',
              'nine-family': 'seven-family',
              'nine models': 'seven models',
          }
          for path in doc_paths:
              text = path.read_text(encoding='utf-8')
              lines = [
                  line for line in text.splitlines()
                  if 'openai/gpt-5-nano' not in line and 'z-ai/glm-4.7-flash' not in line
              ]
              text = '\n'.join(lines) + '\n'
              for source, target in replacements.items():
                  text = text.replace(source, target)
              path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/finalize-seven-trigger.txt
          rm -f .github/workflows/finalize-seven-family.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Validate complete final tree
        run: |
          set -euo pipefail
          ruff format --check .
          ruff check .
          python -m compileall -q python_helper tests scripts
          pytest tests/unit --cov=python_helper --cov-report=term-missing --cov-fail-under=90
          pytest -q
          python scripts/check_cassette_policy.py
          for script in scripts/*.sh dump-to-md.sh; do bash -n "$script"; done
          unset OPENROUTER_API_KEY || true
          ./scripts/verify_all_models.sh
          python scripts/vcr_precommit.py --all-models
          python scripts/benchmark_report.py
      - name: Commit verified finalization
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'fix: finalize seven-family cassette gate'
          git push origin HEAD:fix/decouple-mix-allocation-from-w
