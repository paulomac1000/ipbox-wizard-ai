name: Apply review follow-up

on:
  push:
    branches: [agent/consolidate-pr-review-fixes]

permissions:
  contents: write

concurrency:
  group: review-followup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/consolidate-pr-review-fixes
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Apply reviewed fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          cost_path = Path("python_helper/cost_audit.py")
          cost_text = cost_path.read_text(encoding="utf-8")
          old_cost = '''def source_ledger_included_flag(cost: Mapping[str, Any]) -> bool | None:
              """Read an optional source-ledger flag using the strict scalar contract."""
              value = _first(
                  cost,
                  "source_ledger_included",
                  "ujęty_w_kpir",
                  "ujety_w_kpir",
              )
              if value is None:
                  return None
              return strict_bool(value, "cost.source_ledger_included")
          '''
          new_cost = '''def source_ledger_included_flag(cost: Mapping[str, Any]) -> bool | None:
              """Read an optional source-ledger flag using the strict scalar contract."""
              for field in (
                  "source_ledger_included",
                  "ujęty_w_kpir",
                  "ujety_w_kpir",
              ):
                  if field in cost:
                      return strict_bool(cost[field], "cost.source_ledger_included")
              return None
          '''
          if old_cost not in cost_text:
              raise SystemExit("source-ledger helper no longer matches reviewed code")
          cost_path.write_text(cost_text.replace(old_cost, new_cost, 1), encoding="utf-8")

          audit_path = Path("tests/unit/test_final_audit_regressions.py")
          audit_text = audit_path.read_text(encoding="utf-8")
          old_values = '@pytest.mark.parametrize("value", [0, "false", "nie"])'
          new_values = '@pytest.mark.parametrize("value", [None, 0, "false", "nie"])'
          if old_values not in audit_text:
              raise SystemExit("source-ledger invalid-value test no longer matches reviewed code")
          audit_path.write_text(audit_text.replace(old_values, new_values, 1), encoding="utf-8")

          paid_path = Path("tests/unit/test_paid_recording_safety.py")
          paid_text = paid_path.read_text(encoding="utf-8")
          old_paid = '''def test_direct_live_client_fails_closed_when_provider_cost_is_missing(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              monkeypatch.setenv("OPENROUTER_API_KEY", "test-key")
              monkeypatch.setenv("LLM_PROVIDER", "openrouter")
              monkeypatch.setenv("LLM_MAX_COST_PER_MODEL_USD", "1")
              monkeypatch.setenv("LLM_MAX_TOTAL_COST_USD", "2")
              monkeypatch.setattr(
                  "tests.llm.client.requests.post",
                  lambda *args, **kwargs: _PaidResponse(None),
              )
              client = LLMClient(enforce_cost_limits=True)

              client.call({"model": MODEL})
              with pytest.raises(PaidCostLimitError, match="could not be cost-accounted"):
                  client.raise_if_cost_limit_exceeded()
              with pytest.raises(PaidCostLimitError, match="could not be cost-accounted"):
                  client.call({"model": MODEL})
          '''
          new_paid = '''def test_direct_live_client_fails_closed_when_provider_cost_is_missing(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              monkeypatch.setenv("OPENROUTER_API_KEY", "test-key")
              monkeypatch.setenv("LLM_PROVIDER", "openrouter")
              monkeypatch.setenv("LLM_MAX_COST_PER_MODEL_USD", "1")
              monkeypatch.setenv("LLM_MAX_TOTAL_COST_USD", "2")
              calls = 0

              def post(*args: object, **kwargs: object) -> _PaidResponse:
                  nonlocal calls
                  calls += 1
                  return _PaidResponse(None)

              monkeypatch.setattr("tests.llm.client.requests.post", post)
              client = LLMClient(enforce_cost_limits=True)

              client.call({"model": MODEL})
              with pytest.raises(PaidCostLimitError, match="could not be cost-accounted"):
                  client.raise_if_cost_limit_exceeded()
              with pytest.raises(PaidCostLimitError, match="could not be cost-accounted"):
                  client.call({"model": MODEL})
              assert calls == 1
          '''
          if old_paid not in paid_text:
              raise SystemExit("missing-cost regression test no longer matches reviewed code")
          paid_path.write_text(paid_text.replace(old_paid, new_paid, 1), encoding="utf-8")
          PY

      - name: Format and lint
        run: |
          ruff format python_helper/cost_audit.py tests/unit/test_final_audit_regressions.py tests/unit/test_paid_recording_safety.py
          ruff format --check .
          ruff check .

      - name: Run targeted tests
        run: pytest -q tests/unit/test_final_audit_regressions.py tests/unit/test_paid_recording_safety.py

      - name: Commit clean follow-up
        run: |
          rm .github/workflows/review-followup-null-and-request-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python_helper/cost_audit.py tests/unit/test_final_audit_regressions.py tests/unit/test_paid_recording_safety.py .github/workflows/review-followup-null-and-request-guard.yml
          git commit -m "fix: close source-ledger and paid-request guard gaps"
          git push origin HEAD:agent/consolidate-pr-review-fixes
