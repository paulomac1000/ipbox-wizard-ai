meta:
  id: "37_verify_invalid_tax_form_stop"
  name: "Weryfikacja: Ryczałt niekompatybilny z IP Box (STOP)"
  description: >
    Forma opodatkowania = ryczałt ewidencjonowany.
    IP Box (art. 30ca PIT) jest NIEKOMPATYBILNY z ryczałtem — algorytm
    powinien wygenerować STOP i poinformować użytkownika o braku możliwości
    stosowania ulgi.
  tags: ["verification", "fail", "stop", "tax-form"]
  priority: P1
  expected_stops: ["ryczałt"]

input:
  rok: 2025
  forma_opodatkowania: "ryczalt"
  kontrahenci:
    - nazwa: "TechClient Sp. z o.o."
      waluta: "PLN"
      klauzula_IP: true
      model_komercjalizacji: "przeniesienie_praw"

  miesiace:
    - miesiac: "2025-01"
      faktury:
        - kwota_netto: 20000
          kontrahent: "TechClient Sp. z o.o."
      ewidencja:
        godziny_pracy: 160
        godziny_nie_IP: 0
        procent_faktury_IP: 100
      koszty: []
      opis_projektu: "Zaimplementowałem moduł autoryzacji OAuth2."

  ulgi: {}

assertions:
  # Ryczałt jest niekompatybilny z IP Box — algorytm powinien wygenerować STOP
  # Asercja checked przez meta.expected_stops powyżej
