meta:
  id: "30_edge_related_parties_nexus_mixed"
  name: "Edge: NEXUS mieszany — własne koszty A (sprzęt/licencje) + powiązany podwykonawca C"
  description: >
    Programista ma zarówno własne koszty B+R (laptop, licencje IDE) → NEXUS A,
    jak i powiązanego podwykonawcę (siostra prowadzi CodeSis Sp. z o.o.) → NEXUS C.
    NEXUS < 1.0 — test prawidłowego obliczenia przy mieszanym NEXUS.
    A = 3500 (laptop 3000 + JetBrains 500), C = 10000.
    NEXUS = min(1.0, 3500×1.3 / (3500+10000)) = min(1.0, 4550/13500) ≈ 0.337
  tags: ["edge", "nexus", "related-parties"]
  priority: P1
  expected_stops: []
  expected_reviews: []

input:
  rok: 2025
  forma_opodatkowania: "liniowy_19%"
  zus:
    sposob: "w_KPiR"
    spoleczne_miesiecznie: 1418.48
  kontrahenci:
    - nazwa: "MegaCorp Sp. z o.o."
      waluta: "PLN"
      klauzula_IP: true
      model_komercjalizacji: "przeniesienie_praw"

  miesiace:
    - miesiac: "2025-01"
      faktury:
        - kwota_netto: 20000
          kontrahent: "MegaCorp Sp. z o.o."
      ewidencja:
        godziny_pracy: 160
        godziny_nie_IP: 0
        procent_faktury_IP: 100
      koszty:
        - opis: "Składki ZUS społeczne"
          kwota: 1418.48
        - opis: "Laptop Dell Precision (narzędzie B+R)"
          kwota: 3000.00
        - opis: "Usługi programistyczne — CodeSis Sp. z o.o. (siostra)"
          kwota: 5000
          typ_nexus: "C"
      opis_projektu: >
        Zaprojektowałem architekturę mikroserwisów; część modułów back-end
        zrealizowała spółka powiązana CodeSis.
    - miesiac: "2025-02"
      faktury:
        - kwota_netto: 20000
          kontrahent: "MegaCorp Sp. z o.o."
      ewidencja:
        godziny_pracy: 160
        godziny_nie_IP: 0
        procent_faktury_IP: 100
      koszty:
        - opis: "Składki ZUS społeczne"
          kwota: 1418.48
        - opis: "Licencja JetBrains All Products Pack"
          kwota: 500.00
        - opis: "Usługi programistyczne — CodeSis Sp. z o.o. (siostra)"
          kwota: 5000
          typ_nexus: "C"
      opis_projektu: >
        Wdrożyłem system CI/CD i przeprowadziłem integrację z API zewnętrznego dostawcy.

  ulgi: {}

assertions:
  # A = laptop (3000) + JetBrains (500) = 3500 (własne koszty B+R)
  # C = CodeSis × 2 miesięcy = 10000 (powiązany podwykonawca)
  # NEXUS = min(1.0, 3500×1.3 / (3500+10000)) = 4550/13500 ≈ 0.337
  # Dochód_IP ≈ (40000 - koszty_IP) × NEXUS
  # Szeroki zakres: poprawna kalkulacja ≈567 PLN, ale LLM może uzyskać do ~1000 PLN
  # w zależności od alokacji ZUS i sposobu traktowania CodeSis w NEXUS
  podatek_IP_range: [200, 1100]
