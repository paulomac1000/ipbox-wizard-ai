meta:
  id: "41_ikze_cascade"
  name: "IKZE w kaskadzie odliczeń — odliczenie od dochodu NIE"
  description: >
    W = 70% (część czasu na prace inne niż B+R), więc istnieje dochód NIE.
    IKZE (7000 zł) odliczane od Dochodu_NIE przed obliczeniem podatku NIE.
    Test weryfikuje że IKZE faktycznie redukuje podstawę podatku NIE.
    Bez IKZE: podatek_NIE ≈ 1548 zł. Z IKZE (7000): podatek_NIE ≈ 218 zł.
  tags: ["core", "cascade", "IKZE"]
  priority: "P0"

input:
  rok: 2025
  forma_opodatkowania: "liniowy_19%"
  zus:
    sposob: "w_KPiR"
    spoleczne_miesiecznie: 1418.48

  kontrahenci:
    - nazwa: "TechCorp Sp. z o.o."
      waluta: "PLN"
      klauzula_IP: true
      model_komercjalizacji: "przeniesienie_praw"

  miesiace:
    - miesiac: "2025-01"
      faktury:
        - kwota_netto: 15000
          kontrahent: "TechCorp Sp. z o.o."
      ewidencja:
        godziny_pracy: 160
        godziny_nie_IP: 48   # W = (160-48)/160 = 70%
        procent_faktury_IP: 100
      koszty:
        - opis: "Składki ZUS społeczne"
          kwota: 1418.48
      opis_projektu: >
        Zaprojektowałem i wdrożyłem moduł autoryzacji OAuth2 z obsługą PKCE.

    - miesiac: "2025-02"
      faktury:
        - kwota_netto: 15000
          kontrahent: "TechCorp Sp. z o.o."
      ewidencja:
        godziny_pracy: 160
        godziny_nie_IP: 48   # W = 70%
        procent_faktury_IP: 100
      koszty:
        - opis: "Składki ZUS społeczne"
          kwota: 1418.48
      opis_projektu: >
        Zoptymalizowałem pipeline przetwarzania danych redukując latencję o 35%.

  ulgi:
    IKZE: 7000

assertions:
  # W = 70%, Revenue IP = 30000×0.7 = 21000, Revenue NIE = 9000
  # ZUS (MIX): 2836.96 → IP = 1985.87, NIE = 851.09
  # Dochód IP = 21000 - 1985.87 = 19014.13 → podatek IP ≈ 19014×5% = 951
  # Dochód NIE = 9000 - 851.09 = 8148.91
  # Kaskada: IKZE = 7000 → Podstawa NIE = 8148.91 - 7000 = 1148.91
  # Podatek NIE = round(1148.91)×19% ≈ 218 PLN
  # Bez IKZE byłoby: round(8148.91)×19% ≈ 1548 PLN — zakres [150,350] wyklucza brak IKZE
  podatek_NIE_range: [150, 350]
  podatek_IP_range: [800, 1100]
