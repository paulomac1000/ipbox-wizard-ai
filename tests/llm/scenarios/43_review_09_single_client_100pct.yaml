          kontrahent: "TechCorp Sp. z o.o."
      ewidencja:
        godziny_pracy: 160
        godziny_nie_IP: 0
        procent_faktury_IP: 100
      koszty:
        - opis: "Składki ZUS społeczne"
          kwota: 1418.48
      opis_projektu: >
        Rozwój modułu autoryzacji OAuth2.

    - miesiac: "2025-02"
      faktury:
        - kwota_netto: 20000
          kontrahent: "TechCorp Sp. z o.o."
