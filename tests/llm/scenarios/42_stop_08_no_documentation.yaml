    STOP_08: Przychód IP = 100% deklarowany, ale brak udokumentowanych godzin
    B+R. To fail-fast check — algorytm powinien zatrzymać się lub emitować
    REVIEW.
  tags: [ "stop", "documentation", "fail-fast" ]
  priority: "P0"
  expected_stops: []

input:
  rok: 2025
  forma_opodatkowania: "liniowy_19%"
  zus:
    sposob: "w_KPiR"
    spoleczne_miesiecznie: 1418.48

  kontrahenci:
    - nazwa: "TechCorp Sp. z o.o."
      NIP: "1234567890"
      waluta: "PLN"
      klauzula_IP: true
      model_komercjalizacji: "przeniesienie_praw"

  miesiace:
    - miesiac: "2025-01"
      faktury:
        - kwota_netto: 20000
          kontrahent: "TechCorp Sp. z o.o."
      # BRAK ewidencji — algorytm powinien to wykryć
      ewidencja:
        godziny_pracy: 0
        godziny_nie_IP: 0
        procent_faktury_IP: 100
      koszty:
        - opis: "Składki ZUS społeczne"
          kwota: 1418.48
      opis_projektu: >
        Rozwój modułu autoryzacji OAuth2.

  ulgi: {}

assertions:
  # Algorytm powinien wyemitować STOP_08 lub przynajmniej REVIEW_08
