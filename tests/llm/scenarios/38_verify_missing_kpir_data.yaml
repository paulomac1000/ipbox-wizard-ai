meta:
  id: "38_verify_missing_kpir_data"
  name: "Weryfikacja: Brak danych KPiR — REVIEW o niekompletne dane"
  description: >
    Podane tylko przychody, brak pozycji kosztowych i ewidencji czasu.
    Algorytm powinien zidentyfikować brak KPiR i oznaczyć jako REVIEW
    lub zapytać o brakujące dane przed obliczeniami.
  tags: ["verification", "review", "missing-data"]
  priority: P1
  expected_stops: []
  expected_reviews: []

input:
  rok: 2025
  forma_opodatkowania: "liniowy_19%"
  zus:
    sposob: "w_KPiR"
  kontrahenci:
    - nazwa: "AnonymCorp Sp. z o.o."
      waluta: "PLN"
      klauzula_IP: true
      model_komercjalizacji: "przeniesienie_praw"

  miesiace:
    - miesiac: "2025-01"
      faktury:
        - kwota_netto: 18000
          kontrahent: "AnonymCorp Sp. z o.o."
      # Brak ewidencji czasu (godziny)
      # Brak pozycji kosztowyche (koszty: [])
      koszty: []
      opis_projektu: "Wdrożyłem integrację z API zewnętrznego dostawcy danych."
    - miesiac: "2025-02"
      faktury:
        - kwota_netto: 18000
          kontrahent: "AnonymCorp Sp. z o.o."
      koszty: []
      opis_projektu: "Zoptymalizowałem zapytania SQL redukując czas odpowiedzi o 40%."

  ulgi: {}

assertions:
  # Bez ewidencji godzin W jest nieznany — algorytm powinien użyć max(0) lub zapytać
  # Brak kosztów → IP income = przychód, podatek_IP = 18000*2*5% = 1800
  podatek_IP_range: [1700, 1900]
