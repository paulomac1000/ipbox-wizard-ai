      przychody: 0 # Brak przychodu
      godziny_pracy: 160
      godziny_nie_IP: 0
      koszty:
        - opis: "Leasing"
          kwota: 5000
    - miesiac: "2025-02"
      przychody: 20000
      godziny_pracy: 160
      godziny_nie_IP: 0
      koszty: []

assertions:
  testy_pass: ["TEST_4"]
  podatek_IP_range: [700, 800] # (20000 - 5000) * 0.05 = 750
