meta:
  id: "11_multi_client_mixed_currencies"
  name: "Logika: 2 klientów (PLN + EUR)"
  description: "Weryfikacja agregacji przychodów z różnych walut"
  tags: ["core", "multi-client", "FX"]
  priority: "P1"

input:
  rok: 2025
  forma_opodatkowania: "liniowy_19%"
  zus:
    sposob: "w_KPiR"
  kontrahenci:
    - nazwa: "TechPL"
      waluta: "PLN"
      klauzula_IP: true
    - nazwa: "EuroSoft"
      waluta: "EUR"
      klauzula_IP: true
  miesiace:
    - miesiac: "2025-01"
      przychody_kontrahent:
        TechPL: 10000
        EuroSoft: 3000 # 3000 EUR
      faktury:
        - numer: "FV/EUR/01"
          kontrahent: "EuroSoft"
          kwota_waluta: 3000
          waluta: "EUR"
          data_wystawienia: "2024-12-31" # Kurs z 30.12
          data_wplywu: "2025-01-05"
      godziny_pracy: 160
      godziny_nie_IP: 0
  ulgi: {}

assertions:
  nexus: 1.0
  testy_pass: ["TEST_1", "TEST_2", "TEST_3", "TEST_4", "TEST_5", "TEST_6"]
