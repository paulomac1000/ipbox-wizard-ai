[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "llm: paid or cassette-backed LLM benchmark",
]
addopts = ["--strict-markers", "-ra"]

[tool.coverage.run]
source = ["python_helper"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__", "if TYPE_CHECKING"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "vendor/ai-skills/contracts/confined_io.py",
  "vendor/ai-skills/skills/ci-cd-architect/tools/check_github_actions_policy.py",
  "vendor/ai-skills/skills/ci-cd-architect/tools/check_github_actions_policy_impl.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
