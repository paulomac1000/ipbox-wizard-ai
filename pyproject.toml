[project]
name = "ipbox-wizard-ai"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests for ipbox_calculator.py",
    "llm: scenario tests executed via LLM API",
    "slow: tests that take >10s",
    "smoke: minimal subset for quick validation",
    "P0: Priority 0 (critical)",
    "P1: Priority 1 (high)",
    "P2: Priority 2 (medium)",
]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-ra",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["python_helper"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "if TYPE_CHECKING",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N999", "E501", "E701", "N802", "SIM102", "N815"]
